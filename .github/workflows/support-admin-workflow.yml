name: Support admin workflow regression

on:
  pull_request:
    paths:
      - '.github/workflows/support-admin-workflow.yml'
      - 'beintaskbot-main/.github/workflows/support-admin-workflow.yml'
      - 'beintaskbot-main/docs/tenant-knowledge-candidates.js'
      - 'beintaskbot-main/docs/tenant-knowledge-campaigns.js'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tenant_ai_learning_mcp.py'
      - 'beintaskbot-main/tenant_ai_agents_store.py'
      - 'beintaskbot-main/tenant_knowledge_*.py'
      - 'beintaskbot-main/tenant_case_media_admission.py'
      - 'beintaskbot-main/tenant_case_media_recovery.py'
      - 'beintaskbot-main/tenant_connect_documents.py'
      - 'beintaskbot-main/tenant_connect_media.py'
      - 'beintaskbot-main/tests/test_ai_learning_mcp.py'
      - 'beintaskbot-main/tests/test_ai_agent_deletion_postgres.py'
      - 'beintaskbot-main/tests/test_case_media_admission.py'
      - 'beintaskbot-main/tests/test_case_media_recovery.py'
      - 'beintaskbot-main/tests/test_connect_documents.py'
      - 'beintaskbot-main/tests/test_knowledge_campaign*.py'
      - 'beintaskbot-main/tests/test_knowledge_candidates.py'
      - 'beintaskbot-main/tests/test_knowledge_media.py'
      - 'beintaskbot-main/tests/test_media_spend_grant_postgres.py'
      - 'beintaskbot-main/tests/test_support_cases_*.cjs'
      - 'beintaskbot-main/tests/test_tenant_operator_assignment.py'
      - 'beintaskbot-main/tests/test_tenant_operator_assignment_ui.cjs'
      - 'beintaskbot-main/tests/test_ai_agent_editor_workspace_ui.cjs'
  push:
    paths:
      - '.github/workflows/support-admin-workflow.yml'
      - 'beintaskbot-main/.github/workflows/support-admin-workflow.yml'
      - 'beintaskbot-main/docs/tenant-knowledge-candidates.js'
      - 'beintaskbot-main/docs/tenant-knowledge-campaigns.js'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tenant_ai_learning_mcp.py'
      - 'beintaskbot-main/tenant_ai_agents_store.py'
      - 'beintaskbot-main/tenant_knowledge_*.py'
      - 'beintaskbot-main/tenant_case_media_admission.py'
      - 'beintaskbot-main/tenant_case_media_recovery.py'
      - 'beintaskbot-main/tenant_connect_documents.py'
      - 'beintaskbot-main/tenant_connect_media.py'
      - 'beintaskbot-main/tests/test_ai_learning_mcp.py'
      - 'beintaskbot-main/tests/test_ai_agent_deletion_postgres.py'
      - 'beintaskbot-main/tests/test_case_media_admission.py'
      - 'beintaskbot-main/tests/test_case_media_recovery.py'
      - 'beintaskbot-main/tests/test_connect_documents.py'
      - 'beintaskbot-main/tests/test_knowledge_campaign*.py'
      - 'beintaskbot-main/tests/test_knowledge_candidates.py'
      - 'beintaskbot-main/tests/test_knowledge_media.py'
      - 'beintaskbot-main/tests/test_media_spend_grant_postgres.py'
      - 'beintaskbot-main/tests/test_support_cases_*.cjs'
      - 'beintaskbot-main/tests/test_tenant_operator_assignment.py'
      - 'beintaskbot-main/tests/test_tenant_operator_assignment_ui.cjs'
      - 'beintaskbot-main/tests/test_ai_agent_editor_workspace_ui.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python and isolated SQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest imageio-ffmpeg
          npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0
      - name: Run desktop and API regression journeys
        run: |
          python -c "import os; assert os.environ.get('BEINTASKBOT_TEST_POSTGRES_DSN'), 'PostgreSQL regression tests require BEINTASKBOT_TEST_POSTGRES_DSN'"
          PYTHONPATH=.:tests python -m pytest -q -rs \
            tests/test_ai_learning_mcp.py \
            tests/test_ai_agent_deletion_postgres.py \
            tests/test_case_media_admission.py \
            tests/test_case_media_recovery.py \
            tests/test_connect_documents.py \
            tests/test_knowledge_campaigns.py \
            tests/test_knowledge_campaign_multiprocess.py \
            tests/test_knowledge_campaign_unknown_postgres.py \
            tests/test_knowledge_candidates.py \
            tests/test_knowledge_media.py \
            tests/test_tenant_operator_assignment.py \
            tests/test_media_spend_grant_postgres.py
          node tests/test_support_cases_integration_ui.cjs
          node tests/test_support_cases_modal_ui.cjs
          node tests/test_support_cases_locale_ui.cjs
          node tests/test_published_case_correction_ui.cjs
          node tests/test_published_case_deep_link_ui.cjs
          node tests/test_knowledge_campaigns_ui.cjs
          node tests/test_knowledge_campaign_reconciliation_ui.cjs
          node tests/test_tenant_operator_assignment_ui.cjs
          node tests/test_ai_agent_editor_workspace_ui.cjs
