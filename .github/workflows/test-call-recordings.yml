name: Isolated call recording import
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_call_recording*.py'
      - 'beintaskbot-main/tenant_browser_calls*.py'
      - 'beintaskbot-main/tenant_dialog_lifecycle.py'
      - 'beintaskbot-main/tenant_call_sources*.py'
      - 'beintaskbot-main/tenant_call_identity.py'
      - 'beintaskbot-main/tenant_contact_phone.py'
      - 'beintaskbot-main/tests/test_contact_phone*'
      - 'beintaskbot-main/tenant_whatsapp_history_pairs.py'
      - 'beintaskbot-main/tests/test_whatsapp_history_pairs.py'
      - 'beintaskbot-main/tests/test_call_identity.py'
      - 'beintaskbot-main/tenant_call_audio_storage.py'
      - 'beintaskbot-main/tenant_whatsapp_native*.py'
      - 'beintaskbot-main/tenant_whatsapp_integration*.py'
      - 'beintaskbot-main/tenant_whatsapp_source_control.py'
      - 'beintaskbot-main/tenant_connect_avatars.py'
      - 'beintaskbot-main/tests/test_native_avatars.py'
      - 'beintaskbot-main/tests/test_whatsapp_source_control.py'
      - 'beintaskbot-main/tests/test_whatsapp_integration*'
      - 'beintaskbot-main/ui/src/whatsapp-integration.jsx'
      - 'beintaskbot-main/tenant_group_participants.py'
      - 'beintaskbot-main/tests/test_group_participants.py'
      - 'beintaskbot-main/tests/test_whatsapp_native*'
      - 'beintaskbot-main/docs/tenant-call-sources.js'
      - 'beintaskbot-main/tests/test_call_sources*'
      - 'beintaskbot-main/tests/test_call_audio_storage.py'
      - 'services/whatsapp-calls/**'
      - 'beintaskbot-main/docs/*browser-call*.js'
      - 'beintaskbot-main/tests/test_browser_calls*'
      - 'beintaskbot-main/tests/test_browser_call_timeline.py'
      - 'beintaskbot-main/tenant_operator_dialogs.py'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_call_recordings.py'
      - '.github/workflows/test-call-recordings.yml'
permissions:
  contents: read
jobs:
  recording-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Install verified test FFmpeg without system package mirrors
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/call-test-bin"
          python -c 'import imageio_ffmpeg,os; os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), os.path.join(os.environ["RUNNER_TEMP"],"call-test-bin","ffmpeg"))'
          echo "$RUNNER_TEMP/call-test-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/call-test-bin/ffmpeg" -version | head -n 1
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.3.14 playwright@1.62.1 jsdom@26.1.0
      - run: node .support-test-deps/node_modules/playwright/cli.js install chromium
      - run: python -m pytest -q tests/test_call_recordings.py tests/test_browser_calls.py tests/test_browser_call_timeline.py tests/test_call_sources.py tests/test_call_sources_audio_api.py tests/test_call_audio_storage.py tests/test_tenant_web_routes.py tests/test_tenant_app_pwa_assets.py
      - run: python -m pytest -q tests/test_whatsapp_native_inbox.py tests/test_whatsapp_native_api.py tests/test_whatsapp_native_projection.py tests/test_whatsapp_native_identity.py tests/test_whatsapp_native_consumer.py tests/test_whatsapp_native_transport.py tests/test_whatsapp_native_rollout.py
      - run: python -m pytest -q tests/test_group_participants.py
      - run: python -m pytest -q tests/test_call_identity.py
      - run: python -m pytest -q tests/test_contact_phone.py
      - run: python -m pytest -q tests/test_whatsapp_history_pairs.py
      - run: node tests/test_contact_phone_ui.cjs
      - run: python -m pytest -q tests/test_whatsapp_integration.py tests/test_whatsapp_integration_api.py
      - run: python -m pytest -q tests/test_whatsapp_source_control.py tests/test_native_avatars.py
      - run: node tests/test_whatsapp_integration_ui.cjs
      - run: python -m pytest -q tests/test_whatsapp_native_transition.py
      - run: python -m pytest -q tests/test_browser_calls_postgres.py tests/test_whatsapp_native_inbox_postgres.py tests/test_whatsapp_native_transition_postgres.py
        env:
          BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=55439 user=postgres dbname=postgres
      - run: node tests/test_browser_calls_audio_worklet.cjs
      - run: node tests/test_browser_calls_ui.cjs
      - run: node tests/test_native_source_pairing_ui.cjs
      - run: node tests/test_browser_calls_ui.cjs
        env:
          CALL_TEST_MEDIA: websocket
      - run: node tests/test_connect_missed_calls_ui.cjs
      - run: python -m pytest -q ../services/whatsapp-calls/test_supervisor.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: services/whatsapp-calls/engine/go.sum
      - run: go test -race ./...
        working-directory: services/whatsapp-calls/engine
      - run: go test -race -tags unifiedlab ./cmd/server ./internal/unified
        working-directory: services/whatsapp-calls/engine
