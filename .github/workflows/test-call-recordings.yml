name: Isolated call recording import
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_call_recording*.py'
      - 'beintaskbot-main/tenant_browser_calls*.py'
      - 'beintaskbot-main/docs/*browser-call*.js'
      - 'beintaskbot-main/tests/test_browser_calls*'
      - 'beintaskbot-main/tenant_operator_dialogs.py'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_call_recordings.py'
      - '.github/workflows/test-call-recordings.yml'
permissions:
  contents: read
jobs:
  recording-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.3.14 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: python -m pytest -q tests/test_call_recordings.py tests/test_browser_calls.py tests/test_tenant_web_routes.py tests/test_tenant_app_pwa_assets.py
      - run: python -m pytest -q tests/test_browser_calls_postgres.py
        env:
          BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=55439 user=postgres dbname=postgres
      - run: node tests/test_browser_calls_ui.cjs
      - run: node tests/test_connect_missed_calls_ui.cjs
