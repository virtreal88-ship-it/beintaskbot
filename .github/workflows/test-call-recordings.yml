name: Isolated call recording import
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_call_recording*.py'
      - 'beintaskbot-main/tenant_operator_dialogs.py'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_call_recordings.py'
      - '.github/workflows/test-call-recordings.yml'
permissions:
  contents: read
jobs:
  recording-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.3.14
      - run: python -m pytest -q tests/test_call_recordings.py tests/test_tenant_web_routes.py tests/test_tenant_app_pwa_assets.py
      - run: node tests/test_connect_missed_calls_ui.cjs
