name: Dialogue consultation regression
on:
  pull_request:
    paths:
      - '.github/workflows/dialog-consultations.yml'
      - 'beintaskbot-main/tenant_dialog_consultations*.py'
      - 'beintaskbot-main/tenant_operator_copilot.py'
      - 'beintaskbot-main/tenant_owner_asr_comparison*.py'
      - 'beintaskbot-main/tenant_ai_spend_budget.py'
      - 'beintaskbot-main/docs/tenant-owner-asr-comparison.js'
      - 'beintaskbot-main/tests/test_owner_asr_comparison*'
      - 'beintaskbot-main/tenant_assigned_agent_prompt.py'
      - 'beintaskbot-main/tenant_ai_agent_worker.py'
      - 'beintaskbot-main/tests/test_assigned_agent_prompt_parity.py'
      - 'beintaskbot-main/tenant_dialog_ai_context.py'
      - 'beintaskbot-main/tenant_dialog_media_adapters.py'
      - 'beintaskbot-main/tests/test_dialog_ai_assignment_browser.cjs'
      - 'beintaskbot-main/tests/test_manual_audio_refresh_browser.cjs'
      - 'beintaskbot-main/tenant_connect_transport.py'
      - 'beintaskbot-main/tenant_public_case.py'
      - 'beintaskbot-main/tenant_web_routes.py'
      - 'beintaskbot-main/tenant_web_assets.py'
      - 'beintaskbot-main/docs/tenant-dialog-consultations.js'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_dialog_consultations*'
      - 'beintaskbot-main/tests/test_dialog_developer*'
      - 'beintaskbot-main/tests/test_helper_type_full_app_browser.cjs'
      - 'beintaskbot-main/tests/test_assigned_operator_copilot.py'
      - 'beintaskbot-main/tests/test_operator_audio_transcripts.py'
      - 'beintaskbot-main/tests/test_operator_audio_transcript_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultation-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      DATABASE_URL: postgresql://invalid.invalid/disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
          node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise independent consultations and real PostgreSQL races
        run: |
          PYTHONPATH=.:tests python -m pytest -q -rs \
            tests/test_dialog_consultations.py \
            tests/test_owner_asr_comparison.py \
            tests/test_owner_asr_comparison_api.py \
            tests/test_owner_asr_comparison_postgres.py \
            tests/test_dialog_developer_marker.py \
            tests/test_dialog_consultations_api.py \
            tests/test_dialog_consultations_postgres.py \
            tests/test_assigned_operator_copilot.py \
            tests/test_assigned_agent_prompt_parity.py \
            tests/test_operator_audio_transcripts.py \
            tests/test_tenant_operator_copilot.py \
            tests/test_tenant_public_case.py \
            tests/test_tenant_consultation_group.py \
            tests/test_tenant_internal_consultations_api.py \
            tests/test_group_consultation_receipt.py \
            tests/test_tenant_web_routes.py \
            tests/test_tenant_job_runner.py
          node tests/test_helper_type_full_app_browser.cjs
          node tests/test_dialog_developer_browser.cjs
          node tests/test_dialog_consultations_ui.cjs
          node tests/test_tenant_operator_copilot_ui.cjs
          node tests/test_tenant_operator_mobile_ui.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_operator_audio_transcript_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dialog_ai_assignment_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_manual_audio_refresh_browser.cjs
