permissions:
  contents: read
jobs:
  consultation-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      DATABASE_URL: postgresql://invalid.invalid/disabled
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade fixture executes the exact previous production schema.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest pytest-asyncio
          npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
          node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify native developer question races without skips
        env:
          PYTHONPATH: tests/isolated_database_guard:.:tests
        run: |
          python -m pytest -q -rs tests/test_developer_question_draft_postgres.py --junitxml=/tmp/developer-question-races.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/developer-question-races.xml').getroot().findall('.//testcase')
          assert len(cases) == 9, 'Expected all nine native race tests'
          assert all(case.find('skipped') is None for case in cases), 'Native race tests must not skip'
          print('Verified: all 9 native developer question races executed without skips')
          PY
      - name: Verify automatic intent fences without skips
        env:
          PYTHONPATH: tests/isolated_database_guard:.:tests
        run: |
          python -m pytest -q -rs tests/test_case_followup_intent_fencing.py --junitxml=/tmp/consultation-intent-fences.xml
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/consultation-intent-fences.xml').getroot().findall('.//testcase')
          assert len(cases) == 7, 'Expected all seven native automatic-intent tests'
          assert all(case.find('skipped') is None for case in cases), 'Automatic-intent tests must not skip'
          print('Verified: all 7 automatic-intent fences executed without skips')
          PYTEST
      - name: Verify consultation range changes in Chromium
        run: |
          node tests/test_consultation_range_browser.cjs
      - name: Exercise independent consultations and real PostgreSQL races
        env:
          PYTHONPATH: tests/isolated_database_guard:.:tests
          NODE_PATH: .support-test-deps/node_modules
          SUPPORT_CASES_JSDOM: ../.support-test-deps/node_modules/jsdom
        run: |
          python -m pytest -q -rs \
            tests/test_dialog_consultations.py \
