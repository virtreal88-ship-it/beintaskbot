      - 'beintaskbot-main/tests/test_native_reply_layout_browser.cjs'
      - 'beintaskbot-main/tests/test_native_reply_longpress_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultation-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      DATABASE_URL: postgresql://invalid.invalid/disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest
          npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
          node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise independent consultations and real PostgreSQL races
        run: |
          PYTHONPATH=.:tests python -m pytest -q -rs \
            tests/test_dialog_consultations.py \
            tests/test_support_case_materials.py \
            tests/test_case_consultations_unified.py \
            tests/test_tenant_notification_center.py \
            tests/test_tenant_notification_center_postgres.py \
            tests/test_request_schema_deadlocks.py \
            tests/test_case_consultation_media_replies.py \
            tests/test_tenant_support_inbox.py \
            tests/test_dialog_audio_result_durability.py \
            tests/test_dialog_audio_transcription.py \
            tests/test_dialog_audio_transcription_api.py \
            tests/test_dialog_audio_transcription_postgres.py \
            tests/test_tenant_push_provider.py \
            tests/test_tenant_crm_notice.py \
            tests/test_strong_asr_default.py \
            tests/test_scoped_asr_replacement.py \
            tests/test_strong_asr_cache.py \
            tests/test_owner_asr_comparison.py \
            tests/test_owner_asr_comparison_api.py \
            tests/test_owner_asr_comparison_postgres.py \
            tests/test_dialog_developer_marker.py \
            tests/test_dialog_consultations_api.py \
            tests/test_dialog_consultations_postgres.py \
            tests/test_manual_knowledge_persistence_postgres.py \
            tests/test_dialog_media_grounding.py \
            tests/test_dialog_photo_receipts.py \
            tests/test_dialog_photo_receipts_postgres.py \
            tests/test_connect_group_history.py::test_group_context_retains_safe_staff_and_ai_provenance \
            tests/test_assigned_operator_copilot.py \
            tests/test_required_episode_audio.py \
            tests/test_required_episode_photos.py \
            tests/test_saved_only_copilot.py \
            tests/test_saved_only_copilot_postgres.py \
            tests/test_assigned_agent_prompt_parity.py \
            tests/test_dialog_greeting.py \
            tests/test_operator_audio_transcripts.py \
            tests/test_verified_dialog_phone.py \
            tests/test_tenant_operator_copilot.py \
            tests/test_tenant_public_case.py \
            tests/test_tenant_consultation_group.py \
            tests/test_tenant_internal_consultations_api.py \
            tests/test_group_consultation_receipt.py \
            tests/test_tenant_web_routes.py \
            tests/test_tenant_job_runner.py
          node tests/test_owner_asr_comparison_browser.cjs
          node tests/test_helper_type_full_app_browser.cjs
          node tests/test_helper_modal_mobile_browser.cjs
          node tests/test_dialog_developer_browser.cjs
          node tests/test_dialog_consultations_ui.cjs
          node tests/test_tenant_notification_center_ui.cjs
          node tests/test_tenant_notification_bell_ux_browser.cjs
          node tests/test_support_notification_bridge_ui.cjs
          node tests/test_support_case_materials_ui.cjs
          node tests/test_support_consultation_flow_ui.cjs
          node tests/test_developer_media_reply_ui.cjs
          node tests/test_support_ticket_modal_browser.cjs
          node tests/test_tenant_support_inbox_ui.cjs
          node tests/test_tenant_push_dialog_route_ui.cjs
          node tests/test_tenant_notification_badge_browser.cjs
          node tests/test_dialog_photo_status_ui.cjs
          node tests/test_tenant_operator_copilot_ui.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_saved_only_copilot_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_helper_request_identity_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_manual_knowledge_scope_browser.cjs
          node tests/test_tenant_operator_mobile_ui.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_operator_audio_transcript_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dynamic_audio_menu_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_layout_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_longpress_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dialog_ai_assignment_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_manual_audio_refresh_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_lazy_audio_state_browser.cjs
          PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_audio_reload_intent_browser.cjs
          node tests/test_tenant_chat_attachments_ui.cjs
          node tests/test_voice_card_mobile_browser.cjs
