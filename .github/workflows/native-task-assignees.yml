name: Native task assignee access regression
on:
  pull_request:
    paths:
      - '.github/workflows/native-task-assignees.yml'
      - 'beintaskbot-main/tenant_crm_native_tasks.py'
      - 'beintaskbot-main/tenant_crm_native_task_api.py'
      - 'beintaskbot-main/tenant_crm_native_deals.py'
      - 'beintaskbot-main/tenant_policy.py'
      - 'beintaskbot-main/tenant_member_store.py'
      - 'beintaskbot-main/tenant_workflow_store.py'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/tests/test_native_task_assignee*'
      - 'beintaskbot-main/tests/native_task_assignee_fixture.cjs'
      - 'beintaskbot-main/tests/test_crm_native_tasks.py'
      - 'beintaskbot-main/tests/test_crm_native_task_api.py'
      - 'beintaskbot-main/tests/test_task_assignment_no_move.py'
      - 'beintaskbot-main/tests/test_tenant_crm_native_workflow_ui.cjs'
      - 'beintaskbot-main/tests/test_app_loading_performance.cjs'
      - 'beintaskbot-main/tests/isolated_database_guard/*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-task-access:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: tests/isolated_database_guard:.:tests
      NODE_PATH: .support-test-deps/node_modules
      SUPPORT_CASES_JSDOM: ../.support-test-deps/node_modules/jsdom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: PostgreSQL authority, revocation races and legacy task boundaries
        run: >-
          python -m pytest -q
          tests/test_native_task_assignee_access.py
          tests/test_crm_native_tasks.py
          tests/test_crm_native_task_api.py
          tests/test_task_assignment_no_move.py
      - name: Current app task form and legacy workflow
        run: |
          node tests/test_native_task_assignee_ui.cjs
          node tests/test_tenant_crm_native_workflow_ui.cjs
          node tests/test_app_loading_performance.cjs
      - name: Chromium current app at four viewport widths
        run: node tests/test_native_task_assignee_browser.cjs
