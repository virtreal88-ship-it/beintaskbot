name: BeinSystems Operator login regression

on:
  pull_request:
    paths:
      - '.github/workflows/beinsystems-operator-login.yml'
      - 'beintaskbot-main/tenant_beinsystems_operator.py'
      - 'beintaskbot-main/tenant_beinsystems_operator_schema.py'
      - 'beintaskbot-main/docs/tenant-beinsystems-operator-settings.js'
      - 'beintaskbot-main/tests/test_beinsystems_operator*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          npm install --prefix .support-test-deps --no-save jsdom@26.1.0
      - name: Run Operator Python and PostgreSQL regressions
        run: python -m pytest -q tests/test_beinsystems_operator.py tests/test_beinsystems_operator_postgres.py
      - name: Run Operator settings UI regression
        run: node tests/test_beinsystems_operator_ui.cjs
