      - name: Chromium employee matrix, tasks and CRM
        run: |
          status=0
          node tests/employee_scope_matrix_browser.cjs || status=1
          python -m pytest -q -rs tests/test_ai_scoped_documents_browser.py || status=1
          node tests/test_native_company_deal_source_browser.cjs || status=1
          node tests/test_crm_sync_history_browser.cjs || status=1
          python -m pytest -q -rs tests/test_task_read_save_flow_postgres.py -k actual_tasks_app_reads_and_saves_through_cookie_postgres || status=1
          python -m pytest -q -rs tests/test_contacts_directory_postgres.py -k actual_contacts_directory_app_uses_current_cookie_postgres_and_cached_history || status=1
          exit "$status"
