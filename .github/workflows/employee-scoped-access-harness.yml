name: Employee scoped access isolated patch harness
on:
  push:
    branches: [codex/employee-scope-ci-20261110, codex/employee-scoped-gate-off-release-20261111]
permissions:
  contents: read
jobs:
  scoped-access:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: tests/isolated_database_guard:.:tests
      NODE_PATH: .support-test-deps/node_modules
      SUPPORT_CASES_JSDOM: ../.support-test-deps/node_modules/jsdom
      EMPLOYEE_SCOPE_SCREENSHOTS: employee-scope-screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve verified synthetic patch inputs
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/employee-scoped-access"
          cp -R .ci/employee-scoped-access/. "$RUNNER_TEMP/employee-scoped-access/"
      - name: Check out the exact reviewed upstream baseline
        uses: actions/checkout@v4
        with:
          ref: 5e02c6c12c48b37a9d67346b84f65b05bc0fd2d7
          persist-credentials: false
          clean: true
      - name: Apply patches and verify the exact final source tree
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'employee-scoped-access'
          manifest_bytes = b''.join(p.read_bytes() for p in sorted(root.glob('manifest-*.json-part')))
          assert hashlib.sha256(manifest_bytes).hexdigest() == 'c36d436fae1413d8e31c7db5ff5c54097877abc06c3c86991c28525e69dcc559'
          manifest = json.loads(manifest_bytes)
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()
          assert git('rev-parse', 'HEAD') == manifest['base_commit'] == '5e02c6c12c48b37a9d67346b84f65b05bc0fd2d7'
          assert git('write-tree') == manifest['base_tree'] == '2b139e7f096b9695c8990dc7cfc5049f9466015f'
          assert not pathlib.Path('.ci/employee-scoped-access').exists()
          assert not pathlib.Path('.github/workflows/employee-scoped-access-harness.yml').exists()
          for patch in manifest['patches']:
              parts = []
              for part in patch['parts']:
                  content = (root / part['file']).read_bytes()
                  assert len(content) == part['bytes']
                  assert hashlib.sha256(content).hexdigest() == part['sha256']
                  parts.append(content)
              content = b''.join(parts)
              assert len(content) == patch['bytes']
              assert hashlib.sha256(content).hexdigest() == patch['sha256']
              subprocess.run(['git', 'apply', '--index', '--whitespace=nowarn', '-'], input=content, check=True)
          actual = git('write-tree')
          assert actual == manifest['target_tree'] == 'df54a17c27284007453f4cd0745b14294ed881c6', actual
          assert not git('diff', '--name-only')
          print('Verified exact final source tree:', actual)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Tested source tree: ' + actual + '\n\nLocal source revision: ' + manifest['target_local_commit'] + '\n\nCI-only harness commit, not a release or deploy.\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Select installed Chromium
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_EXECUTABLE_PATH='+require('./.support-test-deps/node_modules/playwright').chromium.executablePath()+'\n')"
      - name: Fetch historical startup-upgrade baseline
        run: git fetch --no-tags --depth=1 origin 972528e30b9750d8b121f55a89d8b21aa20ddf5b
      - name: Scoped authorization and PostgreSQL
        run: >-
          python -m pytest -q -rs
          tests/test_scoped_access_foundation.py
          tests/test_scope_activation_preflight.py
          tests/test_scope_activation_preflight_bootstrap.py
