name: Private CRM owner incident notices
on:
  pull_request:
    paths:
      - '.github/workflows/owner-operational-alerts.yml'
      - 'beintaskbot-main/bot.py'
      - 'beintaskbot-main/tenant_owner_operational_alerts.py'
      - 'beintaskbot-main/tests/test_owner_operational_alerts.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: beintaskbot-main
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install 'psycopg[binary]==3.2.10'
      - run: python3 -m unittest discover -s tests -p test_owner_operational_alerts.py
