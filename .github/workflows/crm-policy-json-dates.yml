name: CRM sync policy JSON dates
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_crm_sync_policy.py'
      - 'beintaskbot-main/tenant_crm_sync_policy_api.py'
      - 'beintaskbot-main/tests/test_crm_sync_policy_json_dates.py'
      - '.github/workflows/crm-policy-json-dates.yml'
permissions:
  contents: read
jobs:
  policy-json-dates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: beintaskbot-main
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=55439 user=postgres password=isolated-test-only dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install aiohttp 'psycopg[binary]'
      - run: python -m unittest discover -s tests -p test_crm_sync_policy_json_dates.py -v
