name: Mobile conversation navigation
on:
  pull_request:
    paths:
      - 'beintaskbot-main/ui/src/app-shell.js'
      - 'beintaskbot-main/ui/src/app-theme.css'
      - 'beintaskbot-main/docs/tenant-chakra-ui.js'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_mobile_chat_nav*'
      - 'beintaskbot-main/tests/test_mobile_bottom_nav_browser.cjs'
      - '.github/workflows/mobile-chat-nav.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-nav:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .support-test-deps --no-package-lock playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: echo "CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('./.support-test-deps/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: |
          node tests/test_mobile_chat_nav.cjs
          node tests/test_mobile_chat_nav_browser.cjs
          node tests/test_mobile_bottom_nav_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-chat-navigation
          path: beintaskbot-main/artifacts/
