name: Realtime voice lease and lifecycle

on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_operator_voice_*.py'
      - 'beintaskbot-main/tenant_operator_realtime_*.py'
      - 'beintaskbot-main/tests/test_tenant_operator_voice_*.py'
      - 'beintaskbot-main/tests/test_tenant_operator_realtime_*.py'
      - 'beintaskbot-main/docs/tenant-copilot-voice-audio.js'
      - 'beintaskbot-main/docs/tenant-copilot-voice-controller.js'
      - 'beintaskbot-main/docs/tenant-operator-copilot-voice.js'
      - 'beintaskbot-main/tests/test_tenant_operator_copilot_audio.cjs'
      - 'beintaskbot-main/tests/test_tenant_operator_voice_greeting.cjs'
      - 'beintaskbot-main/tests/test_tenant_voice_start_failure.py'
      - 'beintaskbot-main/tests/test_voice_causality_repro_local.py'
      - 'beintaskbot-main/docs/tenant-copilot-voice-channel.js'
      - 'beintaskbot-main/tests/test_tenant_voice_pilot_browser.cjs'
      - 'beintaskbot-main/tests/isolated_database_guard/**'
      - 'beintaskbot-main/migrations/voice_lease_provider_open.sql'
      - 'experiments/copilot_realtime_adapter/**'
      - '.github/workflows/realtime-voice-lease.yml'

permissions:
  contents: read

jobs:
  realtime-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        working-directory: beintaskbot-main
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio==1.4.1.post1
          npm install --prefix .support-test-deps --no-save playwright@1.62.1 jsdom@26.1.0
      - name: Install Chromium for voice interruption browser test
        working-directory: beintaskbot-main
        run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run voice admission, wire, and lifecycle tests
        working-directory: beintaskbot-main
        env:
          PYTHONPATH: tests/isolated_database_guard:.:tests:../experiments/copilot_realtime_adapter
        run: >-
          python -m pytest -q
          tests/test_tenant_operator_voice_lease.py
          tests/test_tenant_voice_start_failure.py
          tests/test_tenant_operator_voice_live_admission.py
          tests/test_tenant_operator_voice_input_authority.py
          tests/test_tenant_operator_voice_output_authority.py
          tests/test_tenant_operator_voice_duration.py
          tests/test_tenant_operator_realtime_wire.py
          tests/test_tenant_operator_realtime_aiohttp.py
          tests/test_tenant_operator_voice_latency.py
          tests/test_tenant_operator_voice_stale_ack.py
          tests/test_tenant_operator_voice_duplex.py
          tests/test_tenant_operator_voice_queue_load.py
          tests/test_tenant_operator_voice_terminal_socket.py
          tests/test_tenant_operator_voice_orchestration.py
          tests/test_tenant_operator_voice.py
          tests/test_tenant_operator_voice_api.py
          tests/test_tenant_auth_api.py
          tests/test_tenant_browser_session.py
          tests/test_employee_account_assign_api.py
          tests/test_voice_causality_repro_local.py
      - name: Test bounded browser microphone batching
        working-directory: beintaskbot-main
        run: node --test tests/test_tenant_operator_copilot_audio.cjs tests/test_tenant_operator_voice_greeting.cjs tests/test_tenant_voice_channel_timeout.cjs
      - name: Test automatic voice turns and explicit Stop in browser
        working-directory: beintaskbot-main
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/beintaskbot-main/.support-test-deps/node_modules/playwright
        run: node tests/test_tenant_voice_pilot_browser.cjs
      - name: Run lease and PostgreSQL integration tests
        working-directory: experiments/copilot_realtime_adapter
        env:
          PYTHONPATH: ../../beintaskbot-main:../../beintaskbot-main/tests/isolated_database_guard:../../beintaskbot-main/tests:.
          TEST_DATABASE_URL: host=/tmp/bein-lease-pg.${{ github.run_id }}${{ github.run_attempt }} dbname=voice_lease_test user=postgres
        run: |
          set -euo pipefail
          SOCKET_DIR="/tmp/bein-lease-pg.${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$SOCKET_DIR"
          chmod 0777 "$SOCKET_DIR"
          docker run --detach --name realtime-voice-lease-pg --network none \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=512m \
            --mount "type=bind,src=$SOCKET_DIR,dst=/var/run/postgresql" \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          cleanup() {
            docker exec --user postgres realtime-voice-lease-pg pg_ctl -D /var/lib/postgresql/data stop -m fast >/dev/null 2>&1 || true
            docker exec realtime-voice-lease-pg rm -f /var/run/postgresql/.s.PGSQL.5432 /var/run/postgresql/.s.PGSQL.5432.lock >/dev/null 2>&1 || true
            docker rm --force realtime-voice-lease-pg >/dev/null 2>&1 || true
            # The official Postgres entrypoint changes ownership of its socket
            # directory to postgres inside the bind mount, so the runner needs
            # sudo for this single run-specific /tmp directory.
            sudo rm -rf -- "$SOCKET_DIR"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec realtime-voice-lease-pg pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec realtime-voice-lease-pg createdb -U postgres voice_lease_test
          python -m unittest test_voice_browser_revocation_postgres test_voice_lease test_pilot_admission test_voice_lease_postgres -v
