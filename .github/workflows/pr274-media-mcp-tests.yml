name: PR274 media and MCP tests

on:
  pull_request:
  push:
    branches:
      - fix/read-partial-audio-on-media-error

permissions:
  contents: read

jobs:
  media-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      video-test-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-video-fixture
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=55439 user=postgres password=isolated-video-fixture dbname=postgres
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest imageio-ffmpeg
      - name: Install PDF renderer
        run: |
          packages=()
          command -v pdftoppm >/dev/null || packages+=(poppler-utils)
          command -v ffmpeg >/dev/null || packages+=(ffmpeg)
          if ((${#packages[@]})); then
            sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo timeout 300s env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              install --yes --no-install-recommends "${packages[@]}"
          fi
          pdftoppm -v
          ffmpeg -version | head -n 1
      - name: Install isolated PGlite test dependency
        run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0
      - name: Run media and MCP regression tests
        run: >-
          python -m pytest -q -rs
          tests/test_ai_administrator_read.py
          tests/test_media_evidence.py
          tests/test_media_evidence_pglite.py
          tests/test_knowledge_media.py
          tests/test_ai_learning_mcp.py
          tests/test_ai_training_policy.py
          tests/test_administrator_publication.py
          tests/test_tenant_ai_testing.py
          tests/test_tenant_ai_testing_api.py
          tests/test_media_spend_budget.py
          tests/test_tenant_ai_testing_spend.py
          tests/test_tenant_knowledge_search.py
          tests/test_tenant_ai_testing_retrieval.py
          tests/test_knowledge_candidates.py
          tests/test_case_media_coverage.py
          tests/test_case_media_admission.py
          tests/test_knowledge_refinement.py::test_improve_proposal_only_explicit_save_and_idempotency
          tests/test_knowledge_refinement.py::test_improve_errors_and_changes_never_write_card
          tests/test_knowledge_refinement.py::test_improve_permissions_input_limits_and_request_binding
          tests/test_knowledge_refinement.py::test_improve_channel_revocation_and_known_name_redaction
          tests/test_knowledge_refinement.py::test_improve_timeout_unknown_no_retry_and_token_reservation
          tests/test_knowledge_refinement.py::test_improve_deadline_blocks_proposal
          tests/test_knowledge_refinement.py::test_improve_api_origin_identity_and_dispatch
          tests/test_night_release.py
          tests/test_instruction_library.py
          tests/test_instruction_expert_integration.py
          tests/test_instruction_videos.py
          tests/test_instruction_video_postgres.py
      - name: Run instruction card regression
        run: |
          node tests/test_instruction_editor.cjs
          node tests/test_instruction_video_card.cjs
          SUPPORT_CASES_JSDOM=../.support-test-deps/node_modules/jsdom node tests/test_case_media_coverage_ui.cjs
          node tests/test_knowledge_campaigns_ui.cjs
          node tests/test_case_media_admission_ui.cjs
