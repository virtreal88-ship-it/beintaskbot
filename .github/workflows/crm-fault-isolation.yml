name: CRM fault isolation
on:
  pull_request:
    paths:
      - '.github/workflows/crm-fault-isolation.yml'
      - 'beintaskbot-main/worker_crm_*.py'
      - 'beintaskbot-main/tenant_connect_avatars.py'
      - 'beintaskbot-main/tests/test_crm_fault_isolation.py'
      - 'beintaskbot-main/tests/test_legacy_routes_db_isolation.py'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: beintaskbot-main
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - run: >-
          python -m pytest -q tests/test_crm_fault_isolation.py tests/test_connect_webhook_executor.py
          tests/test_startup_transaction_budget_postgres.py tests/test_avatar_db_isolation.py
          tests/test_tenant_auth_api.py tests/test_tenant_crm_sync.py tests/test_read_timing.py
          tests/test_legacy_routes_db_isolation.py
