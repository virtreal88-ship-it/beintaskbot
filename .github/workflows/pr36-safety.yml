name: PR36 live extraction safety tests
on:
  push:
    branches:
      - codex/support-cases-language-automation
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Run extraction switch tests
        env:
          SUPPORT_CASES_LIVE_EXTRACTION_ENABLED: 'false'
        run: python -m pytest -q tests/test_knowledge_live_queue.py
