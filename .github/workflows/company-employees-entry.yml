name: Company employees entry regression
on:
  pull_request:
    paths:
      - '.github/workflows/company-employees-entry.yml'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/docs/tenant-members-ui.js'
      - 'beintaskbot-main/docs/tenant-view-demand.js'
      - 'beintaskbot-main/docs/tenant-workspace.js'
      - 'beintaskbot-main/docs/tenant-chakra-ui.*'
      - 'beintaskbot-main/ui/**'
      - 'beintaskbot-main/tenant_auth_api.py'
      - 'beintaskbot-main/tenant_members_api.py'
      - 'beintaskbot-main/tenant_member_store.py'
      - 'beintaskbot-main/tenant_policy.py'
      - 'beintaskbot-main/tests/*company_employees*'
      - 'beintaskbot-main/tests/test_tenant_members*'
      - 'beintaskbot-main/tests/test_staff_profile_lifecycle.cjs'
      - 'beintaskbot-main/tests/test_tenant_workspace.cjs'
      - 'beintaskbot-main/tests/test_settings_*.cjs'
      - 'beintaskbot-main/tests/isolated_database_guard/*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-employees-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: tests/isolated_database_guard:.:tests
      NODE_PATH: .support-test-deps/node_modules
      SUPPORT_CASES_JSDOM: ../.support-test-deps/node_modules/jsdom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Select installed Chromium for browser fixtures
        run: |
          node -e "const fs=require('node:fs');fs.appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_EXECUTABLE_PATH='+require('./.support-test-deps/node_modules/playwright').chromium.executablePath()+'\n')"
      - name: Rebuild and verify the production app bundle
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- docs/tenant-chakra-ui.js docs/tenant-chakra-ui.css
      - name: PostgreSQL current membership and real cookie HTTP browser scenarios
        run: >-
          python -m pytest -q -rs
          tests/test_company_employees_navigation_postgres.py
          tests/test_tenant_auth_api.py
          tests/test_tenant_members_api.py
          tests/test_tenant_member_store.py
      - name: Current staff controller, Settings and task navigation
        run: |
          node tests/test_company_employees_entry_ui.cjs
          node tests/test_tenant_members_ui.cjs
          node tests/test_tenant_members_invite_ui.cjs
          node tests/test_staff_profile_lifecycle.cjs
          node tests/test_tenant_workspace.cjs
          node tests/test_settings_family_ui.cjs
          node tests/test_settings_family_browser.cjs
          node tests/test_settings_layout_browser.cjs
          node tests/test_native_task_assignee_ui.cjs
          node tests/test_tenant_crm_native_workflow_ui.cjs
          node tests/test_app_loading_performance.cjs
          node tests/test_tenant_app_syntax.cjs
      - name: Preserved case notification and manual draft navigation
        run: |
          node tests/test_notification_case_targets_ui.cjs
          node tests/test_operator_case_recovery_ui.cjs

      - name: Upload Settings desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-layout-screenshots
          path: beintaskbot-main/tests/artifacts/settings-layout/
          if-no-files-found: ignore
