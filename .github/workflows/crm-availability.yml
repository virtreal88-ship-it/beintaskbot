name: CRM production availability
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: crm-production-availability
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check CRM shell, database readiness and session boundary
        shell: bash
        run: |
          set -eu
          check() {
            curl -fsS --max-time 8 https://crm.pro.az/readyz -o /tmp/crm-ready &&
              grep -qx ready /tmp/crm-ready &&
              curl -fsS --max-time 8 https://crm.pro.az/app -o /tmp/crm-shell &&
              grep -q '/api/platform/me' /tmp/crm-shell &&
              test "$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' https://crm.pro.az/api/platform/me)" = 401
          }
          check || { sleep 5; check; }
