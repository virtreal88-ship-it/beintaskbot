name: Connect pairing visual
on:
  pull_request:
    paths:
      - 'beintaskbot-main/docs/tenant-connect-pairing.js'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/ui/src/app-theme.css'
      - 'beintaskbot-main/tests/test_connect_pairing_browser.cjs'
      - '.github/workflows/connect-pairing-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: beintaskbot-main
    env:
      NODE_PATH: .support-test-deps/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .support-test-deps --no-package-lock playwright@1.62.1 qrcode@1.5.4
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tests/test_connect_pairing_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-pairing-visual
          path: beintaskbot-main/tests/artifacts/qr-pairing/*.png
          if-no-files-found: error
