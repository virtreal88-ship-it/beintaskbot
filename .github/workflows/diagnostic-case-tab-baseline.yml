          code=$?
          echo "16: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_operator_audio_transcript_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-16.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dynamic_audio_menu_browser.cjs" > "baseline-tail-consultation-tail-17.log" 2>&1
          code=$?
          echo "17: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dynamic_audio_menu_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-17.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_layout_browser.cjs" > "baseline-tail-consultation-tail-18.log" 2>&1
          code=$?
          echo "18: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_layout_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-18.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_longpress_browser.cjs" > "baseline-tail-consultation-tail-19.log" 2>&1
          code=$?
          echo "19: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_native_reply_longpress_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-19.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dialog_ai_assignment_browser.cjs" > "baseline-tail-consultation-tail-20.log" 2>&1
          code=$?
          echo "20: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_dialog_ai_assignment_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-20.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_manual_audio_refresh_browser.cjs" > "baseline-tail-consultation-tail-21.log" 2>&1
          code=$?
          echo "21: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_manual_audio_refresh_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-21.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_lazy_audio_state_browser.cjs" > "baseline-tail-consultation-tail-22.log" 2>&1
          code=$?
          echo "22: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_lazy_audio_state_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-22.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_audio_reload_intent_browser.cjs" > "baseline-tail-consultation-tail-23.log" 2>&1
          code=$?
          echo "23: exit=$code PLAYWRIGHT_MODULE=../.support-test-deps/node_modules/playwright node tests/test_audio_reload_intent_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-23.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "node tests/test_tenant_chat_attachments_ui.cjs" > "baseline-tail-consultation-tail-24.log" 2>&1
          code=$?
          echo "24: exit=$code node tests/test_tenant_chat_attachments_ui.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-24.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "node tests/test_voice_card_mobile_browser.cjs" > "baseline-tail-consultation-tail-25.log" 2>&1
          code=$?
          echo "25: exit=$code node tests/test_voice_card_mobile_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-25.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "node tests/test_list_toolbar_mobile_browser.cjs" > "baseline-tail-consultation-tail-26.log" 2>&1
          code=$?
          echo "26: exit=$code node tests/test_list_toolbar_mobile_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-26.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "node tests/test_message_attachment_menu_browser.cjs" > "baseline-tail-consultation-tail-27.log" 2>&1
          code=$?
          echo "27: exit=$code node tests/test_message_attachment_menu_browser.cjs" | tee -a baseline-tail-summary.txt
          cat "baseline-tail-consultation-tail-27.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          timeout 180s bash -c "node tests/test_photo_preview_browser.cjs" > "baseline-tail-consultation-tail-28.log" 2>&1
          code=$?
          echo "28: exit=$code node tests/test_photo_preview_browser.cjs" | tee -a baseline-tail-summary.txt
