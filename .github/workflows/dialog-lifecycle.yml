name: Explicit dialog lifecycle
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_dialog_lifecycle.py'
      - 'beintaskbot-main/tenant_dialog_company_binding.py'
      - 'beintaskbot-main/tenant_dialog_company_operator.py'
      - 'beintaskbot-main/tenant_operator_company_name_guard.py'
      - 'beintaskbot-main/tenant_crm_native_companies.py'
      - 'beintaskbot-main/tenant_dialog_company_completion.py'
      - 'beintaskbot-main/tenant_beinsystems_operator_api.py'
      - 'beintaskbot-main/tenant_dialog_presence.py'
      - 'beintaskbot-main/tenant_web_routes.py'
      - 'beintaskbot-main/tests/test_tenant_web_routes.py'
      - 'beintaskbot-main/tests/test_tenant_operator_presence_ui.cjs'
      - 'beintaskbot-main/tenant_operator_api.py'
      - 'beintaskbot-main/tests/test_dialog_completion_preview.py'
      - 'beintaskbot-main/tests/test_dialog_completion_retry.py'
      - 'beintaskbot-main/tests/test_dialog_bulk_interrupted_ui.cjs'
      - 'beintaskbot-main/tenant_dialog_rollout.py'
      - 'beintaskbot-main/tests/test_*rollout*.py'
      - 'beintaskbot-main/tenant_dialog_episode_cases.py'
      - 'beintaskbot-main/tests/test_dialog_episode_cases.py'
      - 'beintaskbot-main/tenant_*access.py'
      - 'beintaskbot-main/tenant_operator_dialogs.py'
      - 'beintaskbot-main/tenant_connect_transport.py'
      - 'beintaskbot-main/tenant_support_inbox_store.py'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/docs/tenant-dialog-company.js'
      - 'beintaskbot-main/tests/test_dialog_company_ui.cjs'
      - 'beintaskbot-main/tests/test_dialog_lifecycle*'
      - '.github/workflows/dialog-lifecycle.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=test-only dbname=postgres
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
          npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26
      - name: Lifecycle SQL, ownership, AI and native races
        run: python -m pytest -q --tb=short tests/test_dialog_lifecycle*.py tests/test_dialog_completion_preview.py tests/test_dialog_completion_retry.py tests/test_*rollout*.py tests/test_dialog_episode_cases.py tests/test_tenant_chat_api.py tests/test_tenant_notification_center.py tests/test_knowledge_candidates.py tests/test_tenant_web_routes.py
      - name: UI lifecycle and repeated actions
        run: |
          NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_lifecycle_ui.cjs
          NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_company_ui.cjs
          NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_lifecycle_bulk_ui.cjs
          NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_bulk_interrupted_ui.cjs
          NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_group_cards_ui.cjs
          NODE_PATH=.support-test-deps/node_modules node tests/test_tenant_operator_presence_ui.cjs
