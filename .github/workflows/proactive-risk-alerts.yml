name: Proactive risk delivery concurrency
on:
  pull_request:
    paths:
      - '.github/workflows/proactive-risk-alerts.yml'
      - 'beintaskbot-main/tenant_proactive_risk_*.py'
      - 'beintaskbot-main/tenant_proactive_risk_store.py'
      - 'beintaskbot-main/tests/test_tenant_proactive_risk_*.py'
      - 'beintaskbot-main/docs/tenant-risk-alert-detail.js'
      - 'beintaskbot-main/tests/test_tenant_proactive_risk_detail_ui.cjs'
      - 'beintaskbot-main/tests/test_tenant_proactive_risk_detail_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proactive-risk-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
      - name: PostgreSQL concurrency, outbox, and source regressions
        run: >-
          python -m pytest -q -rs
          tests/test_tenant_proactive_risk_concurrency_postgres.py
          tests/test_tenant_proactive_risk_delivery.py
          tests/test_tenant_proactive_risk_policy.py
          tests/test_tenant_proactive_risk_explanation.py
      - name: Risk detail localization and navigation
        run: node tests/test_tenant_proactive_risk_detail_ui.cjs
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Mobile risk detail
        run: node tests/test_tenant_proactive_risk_detail_browser.cjs
