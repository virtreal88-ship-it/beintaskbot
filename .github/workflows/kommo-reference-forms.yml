name: Kommo reference forms
on:
  pull_request:
    paths:
      - 'beintaskbot-main/docs/tenant-task*.js'
      - 'beintaskbot-main/docs/tenant-kommo-deal-card.js'
      - 'beintaskbot-main/docs/deal-phone-duplicates.js'
      - 'beintaskbot-main/tests/test_deal_duplicate_actions_browser.cjs'
      - 'beintaskbot-main/tests/test_phone_duplicates_ui.cjs'
      - 'beintaskbot-main/docs/tenant-kommo-deal-note-create.js'
      - 'beintaskbot-main/docs/tenant-deal-completion.js'
      - 'beintaskbot-main/docs/tenant-support-inbox.js'
      - 'beintaskbot-main/tests/test_support_workspace_browser.cjs'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/docs/tenant-deal-chat.js'
      - 'beintaskbot-main/docs/tenant-chat-history.js'
      - 'beintaskbot-main/tenant_chat_*.py'
      - 'beintaskbot-main/tenant_deal_completion_provider.py'
      - 'beintaskbot-main/tests/test_deal_chat*'
      - 'beintaskbot-main/tenant_kommo*.py'
      - 'beintaskbot-main/tests/test_kommo_reference_forms*'
      - 'beintaskbot-main/tests/test_kommo_pipeline_picker_browser.cjs'
      - 'beintaskbot-main/ui/src/kommo-deal-move.js'
      - 'beintaskbot-main/tests/test_deal_info_actions.cjs'
      - 'beintaskbot-main/tests/test_deal_desktop_sidebar.cjs'
      - 'beintaskbot-main/tests/test_deal_stage_receipt_integration.cjs'
      - 'beintaskbot-main/tests/test_deal_stage_stale_notice.cjs'
      - '.github/workflows/kommo-reference-forms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      PYTHONPATH: tests/isolated_database_guard:.:tests
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m unittest discover -s tests -p 'test_kommo_task_update.py' && python -m unittest discover -s tests -p 'test_kommo_deal_notes.py' && python -m unittest discover -s tests -p 'test_kommo_note_create.py' && python -m unittest discover -s tests -p 'test_kommo_reference_assets.py'
      - run: python -m unittest tests.test_kommo_deal_move tests.test_kommo_board_provenance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .support-test-deps --no-package-lock jsdom@26.1.0 playwright@1.62.1 @electric-sql/pglite@0.5.11
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: echo "CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('./.support-test-deps/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Rebuild and verify shipped bundle
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- docs/tenant-chakra-ui.js docs/tenant-chakra-ui.css
      - name: Authorized recent history and browser races
        run: |
          python -m pytest -q tests/test_deal_chat_recent.py tests/test_deal_chat_pagination_pglite.py tests/test_tenant_chat_import.py tests/test_tenant_chat_import_api.py tests/test_tenant_deal_completion.py tests/test_chat_send_manual_pglite.py tests/test_tenant_chat_send_store.py tests/test_tenant_chat_send.py tests/test_tenant_chat_send_api.py tests/test_tenant_chat_upload.py tests/test_tenant_chat_upload_api.py tests/test_tenant_chat_reader.py tests/test_tenant_chat_api.py tests/test_tenant_chat_history.py tests/test_chat_history_loading.py tests/test_tenant_web_routes.py
          node tests/test_tenant_chat_history_ui.cjs
          node tests/test_tenant_chat_send_ui.cjs
          node tests/test_deal_chat_first_page_browser.cjs
          node tests/test_helper_modal_mobile_browser.cjs
      - name: Support workspace and existing case actions
        run: |
          node tests/test_tenant_support_inbox_ui.cjs
          node tests/test_tenant_support_inbox_display_name.cjs
          node tests/test_support_inbox_scopes_ui.cjs
          node tests/test_support_notification_bridge_ui.cjs
          node tests/test_case_card_tabs_browser.cjs
          CHROMIUM_PATH="$CHROMIUM_EXECUTABLE_PATH" node tests/test_support_ticket_modal_browser.cjs
          node tests/test_support_workspace_browser.cjs
      - run: |
          node tests/test_task_read_save_flow_ui.cjs
          node tests/test_kommo_deal_move_ui.mjs
          node tests/test_kommo_reference_forms.cjs
          node tests/test_kommo_task_due_card.cjs
          node tests/test_kommo_note_create_ui.cjs
          node tests/test_task_date_note_browser.cjs
          node tests/test_deal_info_actions.cjs
          node tests/test_deal_desktop_sidebar.cjs
          node tests/test_phone_duplicates_ui.cjs
          node tests/test_deal_duplicate_actions_browser.cjs
          node tests/test_deal_stage_receipt_integration.cjs
          node tests/test_deal_stage_stale_notice.cjs
          node tests/test_tenant_deal_completion_ui.cjs
          node tests/test_kommo_reference_forms_browser.cjs
          node tests/test_kommo_pipeline_picker_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kommo-reference-forms
          path: |
            beintaskbot-main/tests/artifacts/kommo-*.png
            beintaskbot-main/tests/artifacts/deal-first-page/
            beintaskbot-main/output/support-workspace/
