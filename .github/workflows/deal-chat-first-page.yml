name: Deal chat first page
on:
  pull_request:
    paths:
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/docs/tenant-deal-chat.js'
      - 'beintaskbot-main/docs/tenant-chat-history.js'
      - 'beintaskbot-main/docs/tenant-kommo-deal-card.js'
      - 'beintaskbot-main/tenant_chat_*.py'
      - 'beintaskbot-main/tests/test_deal_chat*'
      - '.github/workflows/deal-chat-first-page.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: beintaskbot-main
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      PYTHONPATH: tests/isolated_database_guard:.:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: echo "CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('./.support-test-deps/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: |
          npm ci --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- docs/tenant-chakra-ui.js docs/tenant-chakra-ui.css
      - run: python -m pytest -q tests/test_deal_chat_recent.py tests/test_deal_chat_pagination_pglite.py tests/test_tenant_chat_reader.py tests/test_tenant_chat_api.py tests/test_tenant_chat_history.py tests/test_chat_history_loading.py tests/test_tenant_web_routes.py
      - run: |
          node tests/test_tenant_chat_history_ui.cjs
          node tests/test_deal_chat_first_page_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deal-chat-browser-traces
          path: beintaskbot-main/tests/artifacts/deal-first-page/
