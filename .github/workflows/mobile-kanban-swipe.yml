name: Mobile Kanban swipe
on:
  pull_request:
    paths:
      - 'beintaskbot-main/docs/tenant-chakra-ui.js'
      - 'beintaskbot-main/ui/src/deal-card-activation.js'
      - 'beintaskbot-main/ui/src/native-deal-board.jsx'
      - 'beintaskbot-main/ui/src/main.jsx'
      - 'beintaskbot-main/tests/test_deal_card_activation_browser.cjs'
      - 'beintaskbot-main/docs/tenant-horizontal-scroll.js'
      - 'beintaskbot-main/docs/tenant-mobile-crm-toolbar.js'
      - 'beintaskbot-main/tests/test_mobile_kanban_swipe_browser.cjs'
      - 'beintaskbot-main/tests/test_mobile_crm_toolbar_browser.cjs'
      - '.github/workflows/mobile-kanban-swipe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-kanban:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .support-test-deps --no-package-lock jsdom@26.1.0 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: echo "CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('./.support-test-deps/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: |
          node tests/test_horizontal_scroll_control.cjs
          node tests/test_mobile_crm_toolbar.cjs
          node tests/test_mobile_crm_toolbar_browser.cjs
          node tests/test_mobile_kanban_swipe_browser.cjs
          node tests/test_deal_card_activation_browser.cjs
