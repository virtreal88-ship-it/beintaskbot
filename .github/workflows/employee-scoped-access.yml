          tests/test_crm_scoped_scalar_api_transport.py
          tests/test_crm_scalar_fences_postgres.py
          tests/test_crm_legacy_transition.py
          tests/test_crm_legacy_transition_postgres.py
          tests/test_tenant_crm_external_sync.py
          tests/test_crm_native_deals.py
          tests/test_crm_native_deal_api.py
          tests/test_crm_native_contacts.py
          tests/test_crm_native_api.py
          tests/test_tenant_ai_native_crm_actions.py
          tests/test_tenant_integration_store.py
          tests/test_tenant_bein_integration.py
          tests/test_tenant_linear.py
          tests/test_tenant_chat_ai.py
          tests/test_tenant_chat_ai_api.py
          tests/test_tenant_kommo.py
          tests/test_tenant_connect_api.py
