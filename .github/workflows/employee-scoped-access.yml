          tests/test_startup_transaction_budget_postgres.py
          tests/test_ai_schema_cold_readiness.py
          tests/test_request_schema_deadlocks.py
          tests/test_consultation_startup_upgrade_postgres.py
      - name: Interface regressions
        if: ${{ !cancelled() }}
        run: |
          node tests/test_employee_creation_scopes_ui.cjs
          node tests/test_employee_card_scopes_ui.cjs
          node tests/test_tenant_night_report_ui.cjs
          node tests/test_employee_scope_settings_ui.cjs
          node tests/test_task_read_save_flow_ui.cjs
          node tests/test_contacts_directory_ui.cjs
          node tests/test_crm_save_receipt_ui.cjs
          node tests/test_crm_sync_history_ui.cjs
          node tests/test_tenant_crm_native_workflow_ui.cjs
          node tests/test_tenant_app_syntax.cjs
          node tests/test_native_company_relation_ui.cjs
          node tests/test_native_company_deal_source_ui.cjs
          node tests/test_tenant_crm_native_modal_ui.cjs
          node tests/test_employee_finance_scopes_ui.cjs
          node tests/test_dialog_source_members_ui.cjs
          node tests/test_tenant_ai_business_analyst_ui.cjs
          node tests/test_tenant_news_member_ui.cjs
          node tests/test_support_inbox_scopes_ui.cjs
          node tests/test_support_consultation_flow_ui.cjs
          node tests/test_shared_integration_settings.cjs
          node tests/test_tenant_kommo_settings.cjs
          node tests/test_tenant_linear_settings.cjs
          node tests/test_tenant_linear_employee_settings.cjs
          node tests/test_tenant_chat_ai_ui.cjs
          node tests/test_ai_scoped_documents_ui.cjs
          node tests/test_tenant_ai_agent_connect_scope_ui.cjs
      - name: Chromium employee matrix, tasks and CRM
        if: ${{ !cancelled() }}
        run: |
          status=0
          node tests/employee_scope_matrix_browser.cjs || status=1
          python -m pytest -q -rs tests/test_ai_scoped_documents_browser.py || status=1
          node tests/test_native_company_deal_source_browser.cjs || status=1
          node tests/test_crm_sync_history_browser.cjs || status=1
          python -m pytest -q -rs tests/test_task_read_save_flow_postgres.py -k actual_tasks_app_reads_and_saves_through_cookie_postgres || status=1
          python -m pytest -q -rs tests/test_contacts_directory_postgres.py -k actual_contacts_directory_app_uses_current_cookie_postgres_and_cached_history || status=1
          exit "$status"
      - name: Save synthetic matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-scope-synthetic-screenshots
          path: beintaskbot-main/employee-scope-screenshots/
          if-no-files-found: warn
