name: Employee scoped access
on:
  push:
    branches: [codex/employee-scope-ci-20261110, codex/employee-scoped-gate-off-release-20261111]
  pull_request:
    paths:
      - '.github/workflows/employee-scoped-access.yml'
      - 'railway.toml'
      - 'start.sh'
      - 'beintaskbot-main/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-access:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: beintaskbot-main
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: tests/isolated_database_guard:.:tests
      NODE_PATH: .support-test-deps/node_modules
      SUPPORT_CASES_JSDOM: ../.support-test-deps/node_modules/jsdom
      EMPLOYEE_SCOPE_SCREENSHOTS: employee-scope-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: npm install --prefix .support-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@26.1.0 playwright@1.62.1
      - run: node .support-test-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Select installed Chromium
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_EXECUTABLE_PATH='+require('./.support-test-deps/node_modules/playwright').chromium.executablePath()+'\n')"
      - name: Fetch historical startup-upgrade baseline
        run: git fetch --no-tags --depth=1 origin 972528e30b9750d8b121f55a89d8b21aa20ddf5b
      - name: Scoped authorization and PostgreSQL
        run: >-
          python -m pytest -q -rs
          tests/test_scoped_access_foundation.py
          tests/test_scope_activation_preflight.py
          tests/test_scope_activation_preflight_bootstrap.py
          tests/test_scoped_access_foundation_postgres.py
          tests/test_employee_scope_settings_postgres.py
          tests/test_employee_creation_scopes.py
          tests/test_employee_creation_scopes_postgres.py
          tests/test_employee_card_scopes.py
          tests/test_employee_card_scopes_postgres.py
          tests/test_employee_task_scopes.py
          tests/test_task_b4_scope_regression.py
          tests/test_crm_scoped_access_postgres.py
          tests/test_crm_source_card_relations.py
          tests/test_crm_source_card_relations_postgres.py
          tests/test_native_crud_dispatch.py
          tests/test_sparse_crm_read_boundary.py
          tests/test_sparse_crm_read_boundary_sql.py
          tests/test_sparse_crm_read_boundary_postgres.py
          tests/test_employee_finance_scopes.py
          tests/test_dialog_source_scopes.py
          tests/test_connect_dialog_equivalence.py
          tests/test_connect_owner_identity.py
          tests/test_direct_reconcile_mcp.py
          tests/test_tenant_operator_workspace.py
          tests/test_dialog_mutation_source_scopes.py
          tests/test_dialog_source_locks_postgres.py
          tests/test_ai_access_ownership_postgres.py
          tests/test_ai_integration_access_preparation.py
          tests/test_analytics_scoped_dialog_guard.py
          tests/test_business_analyst_scoped_boundary.py
          tests/test_business_analyst_voice_scoped_boundary.py
          tests/test_tenant_ai_business_analyst.py
          tests/test_tenant_ai_business_analytics.py
          tests/test_tenant_ai_business_analytics_voice.py
          tests/test_tenant_operator_voice*.py
          tests/test_tenant_operator_realtime_wire.py
          tests/test_tenant_operator_realtime_aiohttp.py
          tests/test_tenant_operator_elevenlabs_voice.py
          tests/test_tenant_news_member_read_postgres.py
          tests/test_support_access_ownership_postgres.py
          tests/test_support_inbox_scopes.py
          tests/test_support_ai_projection_scopes.py
          tests/test_tenant_support_inbox.py
          tests/test_tenant_internal_consultations_api.py
