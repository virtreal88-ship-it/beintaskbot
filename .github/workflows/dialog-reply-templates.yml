name: Dialog reply templates
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_dialog_reply_templates.py'
      - 'beintaskbot-main/tenant_dialog_reply_templates_api.py'
      - 'beintaskbot-main/tenant_dialog_quick_repl*.py'
      - 'beintaskbot-main/tenant_operator_api.py'
      - 'beintaskbot-main/tenant_ai_agent_startup.py'
      - 'beintaskbot-main/tests/test_dialog_reply_template_startup_postgres.py'
      - 'beintaskbot-main/tenant_web_routes.py'
      - 'beintaskbot-main/tenant_web_assets.py'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/docs/tenant-dialog-reply-templates.js'
      - 'beintaskbot-main/docs/tenant-dialog-quick-replies.js'
      - 'beintaskbot-main/docs/tenant-chat-send.js'
      - 'beintaskbot-main/docs/tenant-operator-dialogs.js'
      - 'beintaskbot-main/tests/test_dialog_reply_templates.py'
      - 'beintaskbot-main/tests/test_dialog_quick_replies*'
      - 'beintaskbot-main/tests/test_dialog_reply_templates_ui.cjs'
      - 'beintaskbot-main/tests/test_tenant_web_routes.py'
      - 'beintaskbot-main/tests/test_dialog_reply_templates_postgres.py'
      - '.github/workflows/dialog-reply-templates.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invalid.invalid/disabled
      BEINTASKBOT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      PYTHONPATH: tests/isolated_database_guard:.
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify route catalogue and tenant permissions
        run: python -m pytest -q --tb=short tests/test_dialog_reply_templates.py tests/test_tenant_web_routes.py
      - name: Install UI and isolated database test dependencies
        run: npm install --prefix .support-test-deps --no-save jsdom@26.1.0 @electric-sql/pglite@0.5.11 playwright@1.62.1
      - name: Verify suggestions never send messages
        run: NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_reply_templates_ui.cjs
      - name: Verify history-based replies in the API and Chromium
        run: |
          python -m pytest -q --tb=short tests/test_dialog_quick_replies.py
          .support-test-deps/node_modules/.bin/playwright install --with-deps chromium
          node tests/test_dialog_quick_replies_browser.cjs
      - name: Verify migration and tenant isolation on disposable PostgreSQL
        run: python -m pytest -q --tb=short tests/test_dialog_reply_templates_postgres.py tests/test_dialog_reply_template_startup_postgres.py
