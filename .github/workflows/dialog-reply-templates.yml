name: Dialog reply templates
on:
  pull_request:
    paths:
      - 'beintaskbot-main/tenant_dialog_reply_templates.py'
      - 'beintaskbot-main/tenant_dialog_reply_templates_api.py'
      - 'beintaskbot-main/tenant_web_routes.py'
      - 'beintaskbot-main/tenant_web_assets.py'
      - 'beintaskbot-main/docs/tenant-app.html'
      - 'beintaskbot-main/docs/tenant-dialog-reply-templates.js'
      - 'beintaskbot-main/tests/test_dialog_reply_templates.py'
      - 'beintaskbot-main/tests/test_dialog_reply_templates_ui.cjs'
      - 'beintaskbot-main/tests/test_tenant_web_routes.py'
      - 'beintaskbot-main/tests/test_dialog_reply_templates_postgres.py'
      - '.github/workflows/dialog-reply-templates.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beintaskbot-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify route catalogue and tenant permissions
        run: python -m pytest -q --tb=short tests/test_dialog_reply_templates.py tests/test_tenant_web_routes.py
      - name: Install DOM test dependency
        run: npm install --prefix .support-test-deps --no-save jsdom@26
      - name: Verify suggestions never send messages
        run: NODE_PATH=.support-test-deps/node_modules node tests/test_dialog_reply_templates_ui.cjs
      - name: Verify migration and tenant isolation on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://invalid.invalid/disabled
          TEST_DATABASE_URL: host=/tmp/dialog-templates-pg dbname=dialog_templates_test user=postgres
        run: |
          set -euo pipefail
          SOCKET_DIR=/tmp/dialog-templates-pg
          mkdir -p "$SOCKET_DIR"
          chmod 0777 "$SOCKET_DIR"
          docker run --detach --name dialog-templates-pg --network none \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=256m \
            --mount "type=bind,src=$SOCKET_DIR,dst=/var/run/postgresql" \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          cleanup() {
            docker exec --user postgres dialog-templates-pg pg_ctl -D /var/lib/postgresql/data stop -m fast >/dev/null 2>&1 || true
            docker rm --force dialog-templates-pg >/dev/null 2>&1 || true
            sudo rm -rf -- "$SOCKET_DIR"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker exec dialog-templates-pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec dialog-templates-pg createdb -U postgres dialog_templates_test
          PYTHONPATH=tests/isolated_database_guard:. python -m pytest -q --tb=short tests/test_dialog_reply_templates_postgres.py
