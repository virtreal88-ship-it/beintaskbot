modules:
  crm_health:
    prober: http
    timeout: 5s
    http:
      method: HEAD
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      fail_if_header_not_matches:
        - header: X-Beintaskbot-Health
          regexp: "^worker$"
