services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_agents_test_local
      POSTGRES_USER: ai_agents_test
      POSTGRES_PASSWORD: $AI_AGENTS_TEST_PG_PASSWORD
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agents_test -d ai_agents_test_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
