<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marketplace review access — BeinSystems</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f8f7;color:#163e33;margin:0}main{max-width:480px;margin:60px auto;padding:28px;background:white;border-radius:18px}label{display:block;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbded5;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 20px;background:#087356;color:white;font:inherit}a{color:#087356}#error{color:#a32222}small{color:#657d72}</style></head><body><main><h1>Marketplace review</h1><p>This login opens a separate review company, not the BeinSystems production workspace.</p><form id="login"><label>Login<input name="username" autocomplete="username" maxlength="200" required></label><label>Password<input type="password" name="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><button type="submit">Sign in</button><p id="error" role="alert"></p></form><small>Access is temporary and may be revoked after review. Connect only a test CRM account. Do not enter real customer data.</small><p><a href="/?lang=en#support">Contact support</a> · <a href="/privacy-policy?lang=en">Privacy policy</a></p></main><script>
const form=document.getElementById('login');form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;button.textContent='Signing in…';document.getElementById('error').textContent='';try{const response=await fetch('/api/platform/moderation/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.elements.username.value,password:form.elements.password.value})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Sign-in failed.');location.assign('/setup');}catch(error){document.getElementById('error').textContent=error.message;}finally{form.elements.password.value='';button.disabled=false;button.textContent='Sign in';}});
</script></body></html>
