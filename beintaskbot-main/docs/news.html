<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BeinSystems — Yeniliklər</title>
  <style>
    :root{--ink:#17342f;--muted:#70827e;--green:#0d8a72;--paper:#f7f3eb;--card:#fff;--line:#e5ece8}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f7f3eb,#edf5f1);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    .wrap{width:min(980px,calc(100% - 32px));margin:auto}.top{padding:26px 0 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.back{color:var(--green);text-decoration:none;font-weight:700}
    .hero{padding:54px 0 30px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(36px,7vw,72px);line-height:.98;letter-spacing:-.065em;max-width:700px;margin:16px 0}.hero p{font-size:18px;line-height:1.6;color:var(--muted);max-width:650px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 28px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 18px;color:var(--ink);font:inherit;font-weight:750;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .state{color:var(--muted);padding:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:60px}.item{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 30px #17342f0b}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em}.item h2{font-size:24px;line-height:1.1;margin:18px 0 10px;letter-spacing:-.035em}.summary{font-size:16px;line-height:1.55;margin:0 0 16px}.source{display:inline-block;margin-top:18px;color:var(--green);font-size:13px;font-weight:750;text-decoration:none}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbdad5;border-radius:22px;padding:42px;text-align:center;color:var(--muted)}
    @media(max-width:700px){.top{padding-top:18px}.hero{padding-top:32px}.grid{grid-template-columns:1fr}.item{padding:20px;border-radius:20px}.hero p{font-size:16px}}
  </style>
</head>
<body>
  <header class="wrap top"><div class="brand">CRM Smart Assistant</div><a class="back" href="/">Ana səhifə →</a></header>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">BeinSystems məhsul yenilikləri</div><h1>İşiniz üçün vacib dəyişikliklər.</h1><p>AKUL və DINE layihələrində istifadəyə verilmiş yeni imkanlar burada izah olunur. Texniki səhvlər və daxili düzəlişlər bu siyahıya əlavə edilmir.</p></section>
    <nav class="tabs" aria-label="Layihə seçimi"><button class="tab active" data-project="">Hamısı</button><button class="tab" data-project="AKUL">AKUL</button><button class="tab" data-project="DINE">DINE</button></nav>
    <div id="state" class="state">Yeniliklər yüklənir…</div><section id="news" class="grid" aria-live="polite"></section>
  </main>
  <script>
    const state=document.getElementById('state'),list=document.getElementById('news');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=s=>{try{return new Intl.DateTimeFormat('az-AZ',{dateStyle:'medium'}).format(new Date(s))}catch{return ''}};
    async function load(project=''){
      state.textContent='Yeniliklər yüklənir…'; list.innerHTML='';
      try{const r=await fetch('/api/linear/news'+(project?'?project='+encodeURIComponent(project):''));const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'error');
        if(!d.items.length){state.textContent='Bu layihədə hələ yeni xəbər yoxdur.';list.innerHTML='<div class="empty">Yeni funksiyalar hazır olduqda burada görünəcək.</div>';return}
        state.textContent=d.items.length+' yenilik'; list.innerHTML=d.items.map(x=>{const projectUrl=x.media_url|| (x.project_key==='AKUL'?'https://akul.az':'https://dine.az');return `<article class="item"><div class="meta"><span>${esc(x.project_key)} · ${esc(x.identifier)}</span><span>${esc(date(x.done_at))}</span></div><h2><strong>${esc(x.title)}</strong></h2><p class="summary">${esc(x.summary)}</p><a class="source" href="${esc(projectUrl)}" target="_blank" rel="noreferrer">Xəbərə keçid →</a></article>`}).join('');
      }catch(e){state.textContent='Yeniliklər hazırda yüklənmədi.';list.innerHTML='<div class="empty">Bir az sonra yenidən yoxlayın.</div>'}
    }
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.project)})); load();
  </script>
</body>
</html>
