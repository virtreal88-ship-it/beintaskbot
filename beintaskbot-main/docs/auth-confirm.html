<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beintaskbot — пароль</title><style>body{margin:0;background:#f5f8f7;color:#14241f;font:15px system-ui;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:28px}label{display:grid;gap:6px;margin:14px 0;font-weight:600}input{border:1px solid #cbdad3;border-radius:9px;padding:11px;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#087956;color:#fff;font-weight:700;width:100%}.notice{min-height:22px;color:#9b3b21}</style></head><body><main class="card"><h1 id="title">Создайте пароль</h1><p>Пароль должен содержать не менее 12 символов.</p><form id="form"><label>Новый пароль<input id="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label>Повторите пароль<input id="repeat" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button>Подтвердить</button></form><p id="notice" class="notice"></p></main><script>const token=new URLSearchParams(location.search).get('token')||'',notice=document.getElementById('notice'),password=document.getElementById('password'),repeat=document.getElementById('repeat'),reset=location.pathname==='/auth/reset',link=location.pathname==='/auth/link';if(reset)document.getElementById('title').textContent='Восстановите пароль';if(link)document.getElementById('title').textContent='Подключите email';document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!token||password.value!==repeat.value){notice.textContent='Пароли не совпадают или ссылка недействительна.';return}const url=reset?'/api/platform/auth/password/reset/confirm':link?'/api/platform/auth/email/link/confirm':'/api/platform/auth/email/confirm';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success){notice.textContent=d.error||'Ссылка недействительна.';return}location.href=d.redirect||'/login'};</script></body></html>
