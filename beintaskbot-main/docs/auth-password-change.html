<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beintaskbot — смена пароля</title><style>body{margin:0;background:#f5f8f7;color:#14241f;font:15px system-ui;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:28px}label{display:grid;gap:6px;margin:14px 0;font-weight:600}input{border:1px solid #cbdad3;border-radius:9px;padding:11px;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#087956;color:#fff;font-weight:700;width:100%}.notice{min-height:22px;color:#9b3b21}</style></head><body><main class="card"><h1>Смените временный пароль</h1><p>Это требуется при первом входе.</p><form id="form"><label>Новый пароль<input id="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label>Повторите пароль<input id="repeat" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button>Сохранить и продолжить</button></form><p id="notice" class="notice" role="alert"></p></main><script>const f=document.getElementById('form'),n=document.getElementById('notice');f.onsubmit=async e=>{e.preventDefault();const p=password.value;if(p!==repeat.value){n.textContent='Пароли не совпадают.';return}const r=await fetch('/api/platform/auth/password/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success){n.textContent=d.error||'Не удалось изменить пароль.';return}location.href=d.redirect||'/app'};</script></body></html>
