<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beintaskbot — вход</title><style>body{margin:0;background:#f5f8f7;color:#14241f;font:15px system-ui;display:grid;min-height:100vh;place-items:center}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 14px 42px #10322912}h1{margin:0 0 7px}p{color:#62766e}label{display:grid;gap:6px;margin:12px 0;font-weight:600}input{border:1px solid #cbdad3;border-radius:9px;padding:11px;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#087956;color:#fff;font-weight:700;cursor:pointer;width:100%}.link{margin-top:12px;background:none;color:#087956;text-align:left}.notice{min-height:22px;color:#9b3b21;margin:10px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{font-size:13px}</style></head><body><main class="card"><h1>Beintaskbot</h1><p id="subtitle">Создайте рабочее пространство компании.</p><form id="register"><label>Ваше имя<input name="name" required maxlength="120" autocomplete="name"></label><label>Название компании<input name="company_name" required maxlength="120" autocomplete="organization"></label><label>Телефон<input name="phone" required placeholder="+994…" autocomplete="tel"></label><label>Email<input name="email" required type="email" autocomplete="email"></label><button>Продолжить</button></form><form id="login" hidden><label>Email<input name="email" required type="email" autocomplete="email"></label><label>Пароль<input name="password" required type="password" autocomplete="current-password"></label><button>Войти</button><button type="button" class="link" id="forgot">Восстановить пароль</button></form><p class="notice" id="notice"></p><button type="button" class="link" id="toggle">У меня уже есть аккаунт</button><p class="muted"><a class="muted" href="/login/telegram">Войти через Telegram</a></p></main><script>const $=id=>document.getElementById(id),call=async(url,data)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'Операция не выполнена');return d};let login=false;function view(){ $('register').hidden=login;$('login').hidden=!login;$('toggle').textContent=login?'Создать новый аккаунт':'У меня уже есть аккаунт';$('subtitle').textContent=login?'Войдите в кабинет компании.':'Создайте рабочее пространство компании.';$('notice').textContent=''}$('toggle').onclick=()=>{login=!login;view()};$('register').onsubmit=async e=>{e.preventDefault();try{await call('/api/platform/auth/email/register',Object.fromEntries(new FormData(e.target)));$('notice').style.color='#087956';$('notice').textContent='Проверьте email: мы отправили одноразовую ссылку для создания пароля.'}catch(x){$('notice').style.color='#9b3b21';$('notice').textContent=x.message}};$('login').onsubmit=async e=>{e.preventDefault();try{const d=await call('/api/platform/auth/email/login',Object.fromEntries(new FormData(e.target)));location.href=d.redirect||'/app'}catch(x){$('notice').style.color='#9b3b21';$('notice').textContent=x.message}};$('forgot').onclick=async()=>{const email=$('login').email.value;try{await call('/api/platform/auth/password/reset',{email});$('notice').style.color='#087956';$('notice').textContent='Если этот email зарегистрирован, ссылка для восстановления отправлена.'}catch(x){$('notice').textContent=x.message}};</script></body></html>
