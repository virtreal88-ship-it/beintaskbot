<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beintaskbot — вход</title>
  <style>
    body{margin:0;background:#f5f8f7;color:#14241f;font:15px system-ui;display:grid;min-height:100vh;place-items:center}
    .card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 14px 42px #10322912}
    h1{margin:0 0 7px}p{color:#62766e}label{display:grid;gap:6px;margin:12px 0;font-weight:600}
    input{border:1px solid #cbdad3;border-radius:9px;padding:11px;font:inherit}
    button{padding:11px 14px;border:0;border-radius:9px;background:#087956;color:#fff;font-weight:700;cursor:pointer;width:100%;min-height:43px}
    button:disabled{cursor:wait;opacity:.72}.link{margin-top:12px;background:none;color:#087956;text-align:left}
    .notice{min-height:22px;color:#9b3b21;margin:10px 0}.muted{font-size:13px}
    .spinner{display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid #ffffff80;border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .65s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Beintaskbot</h1>
    <p id="subtitle">Создайте рабочее пространство компании.</p>
    <form id="register">
      <label>Ваше имя<input name="name" required maxlength="120" autocomplete="name"></label>
      <label>Название компании<input name="company_name" required maxlength="120" autocomplete="organization"></label>
      <label>Телефон<input name="phone" required placeholder="+994…" autocomplete="tel"></label>
      <label>Email<input name="email" required type="email" autocomplete="email"></label>
      <button id="register-submit" type="submit">Продолжить</button>
    </form>
    <form id="login" hidden>
      <label>Email<input name="email" required type="email" autocomplete="email"></label>
      <label>Пароль<input name="password" required type="password" autocomplete="current-password"></label>
      <button id="login-submit" type="submit">Войти</button>
      <button type="button" class="link" id="forgot">Восстановить пароль</button>
    </form>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
    <button type="button" class="link" id="toggle">У меня уже есть аккаунт</button>
    <p class="muted"><a class="muted" href="/login/telegram">Войти через Telegram</a></p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const call = async (url, data) => {
      const response = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Операция не выполнена');
      return result;
    };
    const setBusy = (button, busy, waitingText) => {
      if (!button.dataset.label) button.dataset.label = button.textContent;
      button.disabled = busy;
      button.setAttribute('aria-busy', String(busy));
      button.innerHTML = busy ? `<span class="spinner" aria-hidden="true"></span>${waitingText}` : button.dataset.label;
    };
    const notice = (text, good = false) => { $('notice').style.color = good ? '#087956' : '#9b3b21'; $('notice').textContent = text; };
    // `/login` is a first-class sign-in page.  Registration keeps the same
    // shared page at `/register`, while existing Telegram access remains below.
    let login = location.pathname === '/login';
    function view() {
      $('register').hidden = login; $('login').hidden = !login;
      $('toggle').textContent = login ? 'Создать новый аккаунт' : 'У меня уже есть аккаунт';
      $('subtitle').textContent = login ? 'Войдите в кабинет компании.' : 'Создайте рабочее пространство компании.';
      $('notice').textContent = '';
    }
    view();
    $('toggle').onclick = () => { login = !login; view(); };
    $('register').onsubmit = async event => {
      event.preventDefault(); const button = $('register-submit');
      setBusy(button, true, 'Отправляем письмо…');
      try {
        await call('/api/platform/auth/email/register', Object.fromEntries(new FormData(event.target)));
        notice('Проверьте email: мы отправили одноразовую ссылку для создания пароля.', true);
      } catch (error) { notice(error.message); } finally { setBusy(button, false); }
    };
    $('login').onsubmit = async event => {
      event.preventDefault(); const button = $('login-submit');
      setBusy(button, true, 'Входим…');
      try { const result = await call('/api/platform/auth/email/login', Object.fromEntries(new FormData(event.target))); location.href = result.redirect || '/app'; }
      catch (error) { notice(error.message); } finally { setBusy(button, false); }
    };
    $('forgot').onclick = async () => {
      const button = $('forgot'); const email = $('login').email.value;
      setBusy(button, true, 'Отправляем письмо…');
      try { await call('/api/platform/auth/password/reset', {email}); notice('Если этот email зарегистрирован, ссылка для восстановления отправлена.', true); }
      catch (error) { notice(error.message); } finally { setBusy(button, false); }
    };
  </script>
</body>
</html>
