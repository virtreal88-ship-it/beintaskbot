<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beintaskbot — подключить email</title>
  <style>
    body{margin:0;background:#f5f8f7;color:#14241f;font:16px system-ui;display:grid;min-height:100vh;place-items:center}
    main{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:28px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:24px}p{color:#62766e;line-height:1.5}label{display:grid;gap:7px;margin:18px 0 12px;font-weight:600}input{border:1px solid #cbdad3;border-radius:9px;padding:12px;font:inherit}button{width:100%;border:0;border-radius:9px;background:#087956;color:#fff;padding:12px;font:inherit;font-weight:700;cursor:pointer}.notice{min-height:24px;margin:14px 0 0;color:#9b3b21}.ok{color:#087956}
  </style>
</head>
<body><main>
  <h1>Подключить email</h1>
  <p>Вы уже вошли в рабочую CRM через Telegram. Подключите email, чтобы входить в Beintaskbot и Connect по паролю.</p>
  <form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><button id="submit">Отправить письмо</button></form>
  <p id="notice" class="notice" role="status"></p>
</main><script>
  const form=document.getElementById('form'),email=document.getElementById('email'),button=document.getElementById('submit'),notice=document.getElementById('notice');
  form.onsubmit=async event=>{event.preventDefault();button.disabled=true;notice.className='notice';notice.textContent='Отправляем…';try{const response=await fetch('/api/legacy-auth/email/link/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})}),data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw Error(data.error||'Не удалось отправить письмо.');notice.className='notice ok';notice.textContent='Письмо отправлено. Откройте последнюю ссылку из письма и создайте пароль.'}catch(error){notice.textContent=error.message}finally{button.disabled=false}};
</script></body></html>
