<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeniliklər · CRM Smart Assistant</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#122d29;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:40px auto;padding:0 16px}h1{font-size:30px}article{padding:24px;border:1px solid #e0e8e5;border-radius:20px;background:white;margin:18px 0;overflow-wrap:anywhere}h2{font-size:22px;line-height:1.3;font-weight:750;margin:12px 0}p{white-space:pre-wrap}small{color:#6b807d}a{color:#00856e}button{background:#087b64;color:white;border:0;padding:12px 20px;border-radius:12px;cursor:pointer}</style></head>
<body><main><small>CRM Smart Assistant · BeinSystems</small><h1>Yeniliklər</h1><p id="notice" role="status"></p><div id="news"></div><button id="more" hidden>Daha çox</button></main>
<script>
(() => {
  const company=location.pathname.split('/').filter(Boolean).pop(),$=id=>document.getElementById(id);let after=null,busy=false;
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const href=value=>/^(https?:\/\/[^\s]+|tel:\+?[0-9]{7,20})$/i.test(value||'')?value:'';
  async function load(){if(busy)return;busy=true;$('more').disabled=true;$('notice').textContent='Yüklənir…';
    try{const response=await fetch('/api/platform/news/public/'+encodeURIComponent(company)+(after?'?after='+encodeURIComponent(after):''),{credentials:'omit',cache:'no-store'});const result=await response.json();if(!response.ok||!result.success)throw new Error('Xəbərlər yüklənmədi.');
      $('news').insertAdjacentHTML('beforeend',result.news.map(row=>`<article><small>${esc(row.project_name)}${row.identifier?' · '+esc(row.identifier):''} · ${esc(new Date(row.published_at).toLocaleString('en-GB',{timeZone:'Asia/Baku',hour12:false}))}</small><h2>${esc(row.title)}</h2><p>${esc(row.summary)}</p>${href(row.href)?`<a href="${esc(href(row.href))}" target="_blank" rel="noopener noreferrer">${esc(row.url)} ↗</a>`:''}</article>`).join(''));
      after=result.after;$('more').hidden=!after;$('notice').textContent=$('news').children.length?'':'Hələ xəbər dərc olunmayıb.';
    }catch(error){$('notice').textContent=error.message;}finally{busy=false;$('more').disabled=false;}}
  $('more').onclick=load;load();
})();
</script></body></html>
