<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BeinSystems · Инструкции</title>
  <link rel="stylesheet" href="/assets/tenant-instructions.css">
  <link rel="stylesheet" href="/assets/tenant-instructor-lesson.css">
  <style>
    :root{color-scheme:light}
    body{min-height:100vh;margin:0;background:#edf4fa;color:#082342;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
    .instruction-workspace-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:58px;padding:8px max(18px,calc((100% - 1180px)/2));background:#071e3b;color:#fff;box-shadow:0 4px 18px #001a4430}
    .instruction-workspace-brand{flex:0 0 auto;color:#fff;font-weight:700;letter-spacing:.2px}
    .instruction-workspace-tabs{display:flex;align-items:center;gap:8px;margin-left:auto}
    .instruction-workspace-tab{min-height:40px;padding:9px 14px;border:1px solid #ffffff45;border-radius:9px;background:transparent;color:#d7eaf7;font:inherit;font-weight:600;cursor:pointer}
    .instruction-workspace-tab:hover{background:#ffffff14}
    .instruction-workspace-tab[aria-selected=true]{border-color:#73d2ff;background:#12598c;color:#fff}
    .instruction-workspace-tab:focus-visible{outline:3px solid #73d2ff;outline-offset:2px}
    .instruction-workspace-panel[hidden]{display:none!important}
    #guideEditorFrame{display:block;width:100%;height:calc(100dvh - 58px);min-height:620px;border:0;background:#edf4fa}
    #lessonWorkspace{min-height:calc(100dvh - 58px);padding:1px 0}
    #instructions{max-width:1500px;margin:0 auto;padding:16px}
    @media(max-width:650px){
      .instruction-workspace-bar{align-items:flex-start;flex-direction:column;gap:8px;padding:10px 12px}
      .instruction-workspace-brand{font-size:13px}
      .instruction-workspace-tabs{width:100%;margin-left:0}
      .instruction-workspace-tab{flex:1;min-width:0;padding:8px 10px;font-size:13px}
      #guideEditorFrame{height:calc(100dvh - 108px);min-height:520px}
      #lessonWorkspace{min-height:calc(100dvh - 108px)}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="instruction-workspace-bar">
    <div class="instruction-workspace-brand" id="workspaceBrand">AKUL / ИНСТРУКЦИИ</div>
    <nav class="instruction-workspace-tabs" role="tablist" aria-label="Разделы инструкций">
      <button class="instruction-workspace-tab" id="guideTab" type="button" role="tab" aria-controls="guidePanel" aria-selected="true">База статей</button>
      <button class="instruction-workspace-tab" id="lessonsTab" type="button" role="tab" aria-controls="lessonsPanel" aria-selected="false">Пошаговые уроки</button>
    </nav>
  </header>
  <section class="instruction-workspace-panel" id="guidePanel" role="tabpanel" aria-labelledby="guideTab">
    <iframe id="guideEditorFrame" title="Редактор базы статей" src="/guide-editor" loading="lazy" referrerpolicy="no-referrer"></iframe>
  </section>
  <section class="instruction-workspace-panel" id="lessonsPanel" role="tabpanel" aria-labelledby="lessonsTab" hidden>
    <div id="lessonWorkspace"><main id="instructions"></main></div>
  </section>
  <script src="/assets/tenant-instructor-lesson.js"></script>
  <script src="/assets/tenant-instructions.js"></script>
  <script>
    (function(){
      var copy={
        ru:{brand:'AKUL / ИНСТРУКЦИИ',nav:'Разделы инструкций',guide:'База статей',lessons:'Пошаговые уроки',guideTitle:'Редактор базы статей',lessonsTitle:'Библиотека пошаговых уроков'},
        az:{brand:'AKUL / TƏLİMATLAR',nav:'Təlimat bölmələri',guide:'Məqalələr bazası',lessons:'Addım-addım dərslər',guideTitle:'Məqalələr bazasının redaktoru',lessonsTitle:'Addım-addım dərslər kitabxanası'},
        en:{brand:'AKUL / INSTRUCTIONS',nav:'Instruction sections',guide:'Article library',lessons:'Step-by-step lessons',guideTitle:'Article library editor',lessonsTitle:'Step-by-step lesson library'}
      };
      var requested=new URLSearchParams(location.search),language=['ru','az','en'].includes(requested.get('site_lang'))?requested.get('site_lang'):'ru',labels=copy[language];
      var guideTab=document.getElementById('guideTab'),lessonsTab=document.getElementById('lessonsTab'),guidePanel=document.getElementById('guidePanel'),lessonsPanel=document.getElementById('lessonsPanel'),frame=document.getElementById('guideEditorFrame');
      document.documentElement.lang=language;
      document.getElementById('workspaceBrand').textContent=labels.brand;
      guideTab.textContent=labels.guide;
      lessonsTab.textContent=labels.lessons;
      guideTab.setAttribute('aria-label',labels.guide);
      lessonsTab.setAttribute('aria-label',labels.lessons);
      document.querySelector('.instruction-workspace-tabs').setAttribute('aria-label',labels.nav);
      frame.title=labels.guideTitle;
      function show(name){
        var guide=name==='guide';
        guidePanel.hidden=!guide;
        lessonsPanel.hidden=guide;
        guideTab.setAttribute('aria-selected',String(guide));
        lessonsTab.setAttribute('aria-selected',String(!guide));
        guideTab.tabIndex=guide?0:-1;
        lessonsTab.tabIndex=guide?-1:0;
      }
      guideTab.addEventListener('click',function(){show('guide')});
      lessonsTab.addEventListener('click',function(){show('lessons')});
      [guideTab,lessonsTab].forEach(function(tab){tab.addEventListener('keydown',function(event){
        if(event.key==='ArrowRight'||event.key==='ArrowLeft'||event.key==='Home'||event.key==='End'){
          event.preventDefault();
          var next=tab===guideTab?lessonsTab:guideTab;
          if(event.key==='Home')next=guideTab;
          else if(event.key==='End')next=lessonsTab;
          show(next===guideTab?'guide':'lessons');
          next.focus();
        }
      })});
      show(requested.has('lesson')||requested.has('share')?'lessons':'guide');
    })();
  </script>
</body>
</html>
