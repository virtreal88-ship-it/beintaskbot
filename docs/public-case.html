<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Müraciət</title><style>
:root{color-scheme:light;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f8;color:#172033}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:24px auto;padding:0 14px}
.head{background:#fff;border:1px solid #e2e7ef;border-radius:16px 16px 0 0;padding:18px 20px}
.head h1{font-size:20px;margin:0 0 4px}.head p,.notice{color:#596579;font-size:13px;margin:0}
.identity{margin-top:10px;padding-top:10px;border-top:1px solid #e2e7ef;font-size:13px;overflow-wrap:anywhere}.identity span{display:block;color:#596579}
.thread{display:flex;flex-direction:column;gap:10px;padding:20px;min-height:240px;background:#eeeae4;border:1px solid #e2e7ef;border-top:0;border-radius:0 0 16px 16px}
.bubble{align-self:flex-start;min-width:0;max-width:86%;padding:9px 12px 6px;background:#fff;border:1px solid #e8ecf0;border-radius:12px 12px 12px 2px;box-shadow:0 1px 1px #0b141a1f}
.bubble.team{align-self:flex-end;background:#ffe8c4;border-color:transparent;border-radius:12px 12px 2px 12px}
.who{font-size:12px;font-weight:700;color:#52647e;margin-bottom:4px;overflow-wrap:anywhere}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.time{display:block;text-align:right;font-size:11px;color:#596579;margin-top:5px;overflow-wrap:anywhere}
.day{align-self:center;margin:8px 0;padding:4px 12px;background:#fff;border-radius:8px;font-size:12px;color:#52647e;box-shadow:0 1px 1px #0b141a12}
.media-box{max-width:100%;margin-top:9px}.media-box button,.file{font:inherit;font-size:13px;min-height:44px;padding:10px 12px;border:1px solid #b9c6d6;border-radius:9px;background:#fff;color:#14528f;cursor:pointer;overflow-wrap:anywhere}
.media-box button:disabled{cursor:wait}.media-box button:focus-visible,.file:focus-visible{outline:3px solid #145db8;outline-offset:3px}
.media{display:block;max-width:100%;max-height:50vh;margin-top:9px;border-radius:10px}.media.is-expanded{max-height:85vh}.file{display:inline-block;margin-top:9px}
.empty{padding:20px;text-align:center;color:#596579}.notice{margin-top:14px}.media-status{display:block;color:#596579;font-size:12px;margin-top:5px}
@media(max-width:480px){.wrap{margin:0 auto;padding:0}.head{border-radius:0;padding:16px}.thread{border-radius:0;padding:12px 10px;gap:8px}.bubble{max-width:92%}.wrap>.notice{padding:0 14px 16px}.head h1{font-size:18px}}
</style></head><body><main class="wrap"><header class="head"><h1>Müraciət üzrə yazışma</h1><p id="description">Bu, yalnız bu CASE-ə bağlanmış mesajların snapshot-udur; cavab göndərmir və ümumi yazışmanı açmır.</p><p id="snapshot" class="notice"></p><p id="partial" class="notice" hidden>Bəzi fayllar məxfi məlumat işarəsinə görə açılmır.</p></header><section class="thread" id="thread" aria-label="Müraciət üzrə mesajlar"></section><p class="notice">Əlavə edilmiş faylı açmaq üçün uyğun düyməyə toxunun.</p></main>
<script>
(()=>{const data=__CASE_DATA__;const root=document.getElementById('thread');const token=location.pathname.split('/').filter(Boolean).pop();const objectUrls=new Set();const escText=(el,value)=>{el.textContent=String(value||'')};const snapshot=document.getElementById('snapshot');if(data.snapshot_at)escText(snapshot,'Yenilənib: '+new Date(data.snapshot_at).toLocaleString('az-AZ')+' · versiya '+String(data.snapshot_revision||1));document.getElementById('partial').hidden=!data.is_partial;const identity=data.public_identity&&typeof data.public_identity==='object'?data.public_identity:{};if(identity.version===1){document.getElementById('description').hidden=true;snapshot.hidden=true;const box=document.createElement('div');box.className='identity';const at=identity.last_message_at?new Date(identity.last_message_at):null;const fields=[['Müştəri',identity.customer_name],['Təsdiqlənmiş telefon',identity.phone_status==='verified'?identity.verified_phone:null],['Müştərinin şirkəti',identity.company_name],['Sorğunu göndərən əməkdaş',identity.operator_name],['Fraqmentin son mesajı',at&&Number.isFinite(at.getTime())?at.toLocaleString('az-AZ'):null]];for(const [label,value] of fields){const row=document.createElement('span');escText(row,label+': '+(typeof value==='string'&&value.trim()?value:'Göstərilməyib'));box.append(row)}document.querySelector('.head').append(box)}else if(identity.customer_name||identity.phone_status){const box=document.createElement('div');box.className='identity';if(identity.customer_name){const name=document.createElement('strong');escText(name,identity.customer_name);box.append(name)}const phone=document.createElement('span');escText(phone,identity.phone_status==='verified'&&identity.verified_phone?'Телефон подтверждён: '+identity.verified_phone:'Подтверждённый телефон не указан');box.append(phone);document.querySelector('.head').append(box)}
let previousDay='';
for(const m of (Array.isArray(data.public_messages)?data.public_messages:[])){const date=m.at?new Date(m.at):null;const validDate=date&&!Number.isNaN(date.getTime());const day=validDate?date.toLocaleDateString('az-AZ',{day:'2-digit',month:'2-digit',year:'numeric'}):'';if(day&&day!==previousDay){const divider=document.createElement('p');divider.className='day';escText(divider,day);root.append(divider)}previousDay=day;const card=document.createElement('article');card.className='bubble '+((m.direction==='outgoing'||(!m.direction&&['Texniki komanda','BeinSystems','Əməkdaş'].includes(m.speaker)))?'team':'');const who=document.createElement('div');who.className='who';escText(who,m.speaker||'Müraciət');card.append(who);const body=document.createElement('div');body.className='text';escText(body,m.text);card.append(body);
if(data.selected_media_ids&&data.selected_media_ids.includes(m.id)){const kind=m.type;const box=document.createElement('div'),button=document.createElement('button'),status=document.createElement('small');box.className='media-box';button.type='button';button.textContent=kind==='image'?'Şəkli aç':kind==='video'?'Videonu aç':kind==='audio'||kind==='voice'?'Səsə qulaq as':'Sənədi aç';status.className='media-status';status.setAttribute('role','status');box.append(button,status);card.append(box);button.onclick=async()=>{if(button.dataset.url){if(kind==='image'){const expanded=box.querySelector('img')?.classList.toggle('is-expanded');button.textContent=expanded?'Şəkli kiçilt':'Şəkli böyüt';button.setAttribute('aria-expanded',String(!!expanded))}return}button.disabled=true;status.textContent='Yüklənir…';try{const response=await fetch('/public/case/'+encodeURIComponent(token)+'/media/'+encodeURIComponent(m.id),{credentials:'omit',cache:'no-store'});if(!response.ok)throw new Error('Fayl əlçatan deyil. Yenidən yoxlayın.');const blob=await response.blob();if(!blob.size||blob.size>100*1024*1024)throw new Error('Faylın ölçüsü dəstəklənmir.');const src=URL.createObjectURL(blob);objectUrls.add(src);button.dataset.url=src;let media;if(kind==='image'){media=document.createElement('img');media.alt='Müraciətə əlavə edilmiş şəkil';media.className='media';media.src=src;button.setAttribute('aria-expanded','false')}else if(kind==='video'){media=document.createElement('video');media.className='media';media.controls=true;media.preload='none';media.src=src}else if(kind==='audio'||kind==='voice'){media=document.createElement('audio');media.className='media';media.controls=true;media.preload='none';media.src=src}else{media=document.createElement('a');media.className='file';media.href=src;media.textContent='Əlavə edilmiş sənədi endir';media.rel='noopener noreferrer';media.download='attachment'}if(media.tagName!=='A')media.onerror=()=>{media.remove();URL.revokeObjectURL(src);objectUrls.delete(src);delete button.dataset.url;button.hidden=false;button.textContent='Yenidən yoxla';status.textContent='Fayl açıla bilmədi.'};box.insertBefore(media,status);button.textContent=kind==='image'?'Şəkli böyüt':'Yükləndi';if(kind!=='image'&&kind!=='picture')button.hidden=true;status.textContent=''}catch(error){status.textContent=error.message||'Fayl əlçatan deyil.';button.textContent='Yenidən yoxla'}finally{button.disabled=false}}}
if(m.at){const time=document.createElement('time');time.className='time';if(validDate){time.dateTime=date.toISOString();time.title=date.toLocaleString('az-AZ');escText(time,date.toLocaleTimeString('az-AZ',{hour:'2-digit',minute:'2-digit'}))}else{escText(time,m.at)}card.append(time)}root.append(card)}if(!root.childElementCount){root.innerHTML='<p class="empty">Bu müraciət üçün göstəriləcək mesaj yoxdur.</p>'}
window.addEventListener('pagehide',()=>{for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.clear()},{once:true});
})();
</script></body></html>
