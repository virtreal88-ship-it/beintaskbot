<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Müraciət</title><style>
:root{color-scheme:light;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f8;color:#172033}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:32px auto;padding:0 14px}.head,.bubble{background:#fff;border:1px solid #e2e7ef;border-radius:16px;box-shadow:0 4px 16px #18243a0b}.head{padding:18px 20px;margin-bottom:14px}.head h1{font-size:20px;margin:0 0 4px}.head p,.notice{color:#596579;font-size:13px;margin:0}.thread{display:grid;gap:10px}.bubble{padding:14px 16px;max-width:92%}.bubble.team{margin-left:auto;background:#edf5ff}.who{font-size:12px;font-weight:700;color:#52647e;margin-bottom:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.time{font-size:11px;color:#7c8798;margin-top:8px}.media{display:block;max-width:100%;max-height:65vh;margin-top:9px;border-radius:10px}.file{display:inline-block;margin-top:9px;color:#145db8}.empty{padding:20px;text-align:center;color:#596579}.notice{margin-top:14px}
</style></head><body><main class="wrap"><header class="head"><h1>Müraciət üzrə yazışma</h1><p>Bu, yalnız seçilmiş müraciət mesajlarını göstərən, cavab göndərməyən səhifədir.</p></header><section class="thread" id="thread" aria-live="polite"></section><p class="notice">Əlavənin göstərilməsi onun məzmununun yoxlanıldığını və ya problemin səbəbini təsdiqləmir.</p></main>
<script>
(()=>{const data=__CASE_DATA__;const root=document.getElementById('thread');const token=location.pathname.split('/').filter(Boolean).pop();const escText=(el,value)=>{el.textContent=String(value||'')};
for(const m of (Array.isArray(data.public_messages)?data.public_messages:[])){const card=document.createElement('article');card.className='bubble '+(m.speaker==='Texniki komanda'?'team':'');const who=document.createElement('div');who.className='who';escText(who,m.speaker||'Müraciət');card.append(who);const body=document.createElement('div');body.className='text';escText(body,m.text);card.append(body);
if(data.selected_media_ids&&data.selected_media_ids.includes(m.id)){const src='/public/case/'+encodeURIComponent(token)+'/media/'+encodeURIComponent(m.id);const kind=m.type;let media;if(kind==='image'){media=document.createElement('img');media.alt='Müraciətə əlavə edilmiş şəkil';media.className='media';media.loading='lazy';media.src=src}else if(kind==='video'){media=document.createElement('video');media.className='media';media.controls=true;media.preload='none';media.src=src}else if(kind==='audio'||kind==='voice'){media=document.createElement('audio');media.controls=true;media.preload='none';media.src=src}else{media=document.createElement('a');media.className='file';media.href=src;media.textContent='Əlavə edilmiş sənədi aç';media.rel='noreferrer'}card.append(media)}
if(m.at){const time=document.createElement('time');time.className='time';escText(time,m.at);card.append(time)}root.append(card)}if(!root.childElementCount){root.innerHTML='<p class="empty">Bu müraciət üçün göstəriləcək mesaj yoxdur.</p>'}
})();
</script></body></html>
