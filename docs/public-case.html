<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Müraciət</title><style>
:root{color-scheme:light;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f8;color:#172033}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:32px auto;padding:0 14px}.head,.bubble{background:#fff;border:1px solid #e2e7ef;border-radius:16px;box-shadow:0 4px 16px #18243a0b}.head{padding:18px 20px;margin-bottom:14px}.head h1{font-size:20px;margin:0 0 4px}.head p,.notice{color:#596579;font-size:13px;margin:0}.thread{display:grid;gap:10px}.bubble{padding:14px 16px;max-width:92%}.bubble.team{margin-left:auto;background:#edf5ff}.who{font-size:12px;font-weight:700;color:#52647e;margin-bottom:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.time{font-size:11px;color:#7c8798;margin-top:8px}.media{display:block;max-width:100%;max-height:65vh;margin-top:9px;border-radius:10px}.media.is-expanded{max-width:90vw;max-height:85vh}.file{display:inline-block;margin-top:9px;color:#145db8}.empty{padding:20px;text-align:center;color:#596579}.notice{margin-top:14px}.media-status{display:block;color:#596579;font-size:12px;margin-top:5px}
</style></head><body><main class="wrap"><header class="head"><h1>Müraciət üzrə yazışma</h1><p>Bu, yalnız bu CASE-ə bağlanmış mesajların snapshot-udur; cavab göndərmir və ümumi yazışmanı açmır.</p><p id="snapshot" class="notice"></p><p id="partial" class="notice" hidden>Qismən məlumat: faylların məzmunu bu səhifədə paylaşılmır.</p></header><section class="thread" id="thread" aria-live="polite"></section><p class="notice">Fayl bu səhifədə görünməsə belə, onun məzmunu yoxlanılmış sayılmır.</p></main>
<script>
(()=>{const data=__CASE_DATA__;const root=document.getElementById('thread');const token=location.pathname.split('/').filter(Boolean).pop();const objectUrls=new Set();const escText=(el,value)=>{el.textContent=String(value||'')};const snapshot=document.getElementById('snapshot');if(data.snapshot_at)escText(snapshot,'Yenilənib: '+new Date(data.snapshot_at).toLocaleString('az-AZ')+' · versiya '+String(data.snapshot_revision||1));document.getElementById('partial').hidden=!data.is_partial;
for(const m of (Array.isArray(data.public_messages)?data.public_messages:[])){const card=document.createElement('article');card.className='bubble '+(m.speaker==='Texniki komanda'?'team':'');const who=document.createElement('div');who.className='who';escText(who,m.speaker||'Müraciət');card.append(who);const body=document.createElement('div');body.className='text';escText(body,m.text);card.append(body);
if(data.selected_media_ids&&data.selected_media_ids.includes(m.id)){const kind=m.type;const box=document.createElement('div'),button=document.createElement('button'),status=document.createElement('small');box.className='media-box';button.type='button';button.textContent=kind==='image'?'Şəkli aç':kind==='video'?'Videonu aç':kind==='audio'||kind==='voice'?'Səsə qulaq as':'Sənədi aç';status.className='media-status';status.setAttribute('role','status');box.append(button,status);card.append(box);button.onclick=async()=>{if(button.dataset.url){if(kind==='image')box.querySelector('img')?.classList.toggle('is-expanded');return}button.disabled=true;status.textContent='Yüklənir…';try{const response=await fetch('/public/case/'+encodeURIComponent(token)+'/media/'+encodeURIComponent(m.id),{credentials:'omit',cache:'no-store'});if(!response.ok)throw new Error('Fayl əlçatan deyil. Yenidən yoxlayın.');const blob=await response.blob();if(!blob.size||blob.size>100*1024*1024)throw new Error('Faylın ölçüsü dəstəklənmir.');const src=URL.createObjectURL(blob);objectUrls.add(src);button.dataset.url=src;let media;if(kind==='image'){media=document.createElement('img');media.alt='Müraciətə əlavə edilmiş şəkil';media.className='media';media.src=src;media.onclick=()=>media.classList.toggle('is-expanded')}else if(kind==='video'){media=document.createElement('video');media.className='media';media.controls=true;media.preload='none';media.src=src}else if(kind==='audio'||kind==='voice'){media=document.createElement('audio');media.className='media';media.controls=true;media.preload='none';media.src=src}else{media=document.createElement('a');media.className='file';media.href=src;media.textContent='Əlavə edilmiş sənədi endir';media.rel='noopener noreferrer';media.download='attachment'}if(media.tagName!=='A')media.onerror=()=>{media.remove();URL.revokeObjectURL(src);objectUrls.delete(src);delete button.dataset.url;button.hidden=false;button.textContent='Yenidən yoxla';status.textContent='Fayl açıla bilmədi.'};box.insertBefore(media,status);button.textContent=kind==='image'?'Şəkli kiçilt':'Yükləndi';if(kind!=='image'&&kind!=='picture')button.hidden=true;status.textContent=''}catch(error){status.textContent=error.message||'Fayl əlçatan deyil.';button.textContent='Yenidən yoxla'}finally{button.disabled=false}}}
if(m.at){const time=document.createElement('time');time.className='time';escText(time,m.at);card.append(time)}root.append(card)}if(!root.childElementCount){root.innerHTML='<p class="empty">Bu müraciət üçün göstəriləcək mesaj yoxdur.</p>'}
window.addEventListener('pagehide',()=>{for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.clear()},{once:true});
})();
</script></body></html>
